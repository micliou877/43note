<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="照片筆記" />
<meta name="theme-color" content="#0d9488" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>照片筆記</title>
<style>
  :root {
    --bg-app: #f8fafc;
    --bg-surface: #ffffff;
    --bg-subtle: #f1f5f9;
    --bg-hover: #f1f5f9;
    --bg-active: #f0fdfa;
    --border: #e2e8f0;
    --border-subtle: #f1f5f9;
    --border-strong: #cbd5e1;
    --text-primary: #0f172a;
    --text-body: #334155;
    --text-secondary: #475569;
    --text-muted: #64748b;
    --text-faint: #94a3b8;
    --accent: #0d9488;
    --accent-hover: #0f766e;
    --accent-soft: #f0fdfa;
    --accent-border: #99f6e4;
    --accent-ring: rgba(13, 148, 136, 0.16);
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --danger-border: #fecaca;
    --warning: #d97706;
    --warning-soft: #fffbeb;
    --warning-border: #fde68a;
    --info: #2563eb;
    --info-soft: #eff6ff;
    --info-border: #dbeafe;
    --success: #059669;
    --success-soft: #ecfdf5;
    --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.10);
    --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.18);
    --overlay: rgba(15, 23, 42, 0.52);
    --z-sticky: 10;
    --z-dropdown: 60;
    --z-modal: 100;
    --z-imgbar: 400;
    --z-search: 500;
    --z-overdue: 600;
    --z-toast: 900;
  }
  [data-theme="dark"] {
    --bg-app: #0b1120;
    --bg-surface: #111827;
    --bg-subtle: #1e293b;
    --bg-hover: #1e293b;
    --bg-active: rgba(20, 184, 166, 0.14);
    --border: #1f2937;
    --border-subtle: #1a2332;
    --border-strong: #334155;
    --text-primary: #f1f5f9;
    --text-body: #e2e8f0;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    --text-faint: #64748b;
    --accent: #14b8a6;
    --accent-hover: #2dd4bf;
    --accent-soft: rgba(20, 184, 166, 0.14);
    --accent-border: rgba(45, 212, 191, 0.35);
    --accent-ring: rgba(20, 184, 166, 0.28);
    --danger: #f87171;
    --danger-soft: rgba(239, 68, 68, 0.14);
    --danger-border: rgba(248, 113, 113, 0.35);
    --warning: #fbbf24;
    --warning-soft: rgba(245, 158, 11, 0.14);
    --warning-border: rgba(251, 191, 36, 0.32);
    --info: #60a5fa;
    --info-soft: rgba(59, 130, 246, 0.15);
    --info-border: rgba(96, 165, 250, 0.32);
    --success: #34d399;
    --success-soft: rgba(16, 185, 129, 0.15);
    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);
    --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.6);
    --overlay: rgba(2, 6, 23, 0.72);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-app);
    color: var(--text-primary);
    font-family: "Inter", "Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  input, textarea, button, select { font-family: inherit; }
  .tabular { font-variant-numeric: tabular-nums; }

  /* 精緻按鈕互動回饋（不再粗暴壓暗白底按鈕） */
  button:not([disabled]) {
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  button:not([disabled]):active { transform: scale(0.98); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn-primary:not([disabled]):hover { background: var(--accent-hover) !important; box-shadow: 0 2px 8px var(--accent-ring); }
  .btn-ghost:not([disabled]):hover { background: var(--bg-hover) !important; border-color: var(--border-strong) !important; color: var(--text-primary) !important; }
  .btn-danger:not([disabled]):hover { background: var(--danger-soft) !important; border-color: var(--danger) !important; }
  .btn-icon {
    display: inline-flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: var(--text-muted);
    border-radius: 6px; cursor: pointer; padding: 4px;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .btn-icon:hover { background: var(--bg-hover); color: var(--text-primary); }
  .btn-icon.is-active { background: var(--accent-soft); color: var(--accent); }
  .btn-icon.is-danger:hover { background: var(--danger-soft); color: var(--danger); }

  .fmt-btn:not([disabled]):hover { background: var(--bg-hover) !important; color: var(--text-primary) !important; }
  .fmt-btn.is-active { background: var(--accent-soft) !important; color: var(--accent) !important; }

  .nav-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 11px; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 500; border: 1px solid transparent;
    background: transparent; color: var(--text-secondary);
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
  .nav-item.is-active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); font-weight: 600; }

  /* 列表列與桌面 Hover 才浮現操作圖示 */
  .list-row { transition: background-color 0.12s ease; }
  .list-row:hover { background: var(--bg-hover); }
  .list-row.is-active { background: var(--bg-active); }
  .row-actions { display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0; }
  @media (hover: hover) and (min-width: 769px) {
    .list-row .row-actions { opacity: 0; pointer-events: none; transition: opacity 0.14s ease; }
    .list-row:hover .row-actions,
    .list-row:focus-within .row-actions,
    .list-row .row-actions.always-show { opacity: 1; pointer-events: auto; }
  }

  /* 資料夾容器：柔和底色＋左側細色條 */
  .folder-group {
    background: var(--bg-subtle);
    border-radius: 8px;
    margin-bottom: 6px;
    border-left: 3px solid var(--folder-accent, var(--accent));
    overflow: hidden;
  }
  .folder-head {
    display: flex; align-items: center; gap: 4px;
    padding: 6px 8px; font-size: 12px; font-weight: 600;
    color: var(--text-secondary); user-select: none;
    transition: background-color 0.12s ease;
  }
  .folder-head:hover { background: rgba(15, 23, 42, 0.03); }
  [data-theme="dark"] .folder-head:hover { background: rgba(255, 255, 255, 0.04); }

  /* 下拉選單與色盤 Popover */
  .dropdown-wrap { position: relative; display: inline-flex; }
  .dropdown-menu {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: var(--z-dropdown);
    min-width: 176px; padding: 6px;
    background: var(--bg-surface); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow-md);
    animation: popIn 0.14s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .dropdown-menu.align-right { left: auto; right: 0; }
  .dropdown-section {
    padding: 5px 8px 3px; font-size: 10.5px; font-weight: 600;
    color: var(--text-faint); letter-spacing: 0.04em;
  }
  .dropdown-sep { height: 1px; background: var(--border-subtle); margin: 4px 0; }
  .dropdown-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 7px 9px; border: none; background: transparent;
    border-radius: 7px; cursor: pointer; font-size: 12.5px;
    color: var(--text-body); text-align: left; white-space: nowrap;
  }
  .dropdown-item:hover { background: var(--bg-hover); color: var(--text-primary); }
  .dropdown-item.is-danger { color: var(--danger); }
  .dropdown-item.is-danger:hover { background: var(--danger-soft); }
  .dropdown-item .kbd {
    margin-left: auto; font-size: 10.5px; color: var(--text-faint);
    background: var(--bg-subtle); padding: 1px 5px; border-radius: 4px;
  }

  /* Modal & Toast 動畫 */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: translateY(-4px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-8px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes pulseBg { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.95; } }
  .modal-overlay { animation: fadeIn 0.14s ease; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .modal-card { animation: modalIn 0.18s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
  .skeleton-bar { background: var(--bg-subtle); border-radius: 6px; animation: pulseBg 1.4s ease-in-out infinite; }

  /* Toast 系統 */
  .toast-stack {
    position: fixed; top: 16px; right: 16px; z-index: var(--z-toast);
    display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: min(360px, calc(100vw - 32px));
  }
  .toast-item {
    pointer-events: auto; display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 500;
    background: var(--bg-surface); color: var(--text-primary);
    border: 1px solid var(--border); box-shadow: var(--shadow-md);
    animation: toastIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .toast-item.success { border-left: 3px solid var(--success); }
  .toast-item.error { border-left: 3px solid var(--danger); }
  .toast-item.warning { border-left: 3px solid var(--warning); }
  .toast-item.info { border-left: 3px solid var(--accent); }

  /* Input / Select focus */
  input:not([type="range"]):not([type="file"]):not([type="checkbox"]), textarea, select {
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
  }
  input:not([type="range"]):not([type="file"]):not([type="checkbox"]):focus,
  textarea:focus, select:focus {
    border-color: var(--accent) !important;
    box-shadow: 0 0 0 3px var(--accent-ring) !important;
    outline: none;
  }
  .no-focus-ring:focus { box-shadow: none !important; border-color: transparent !important; }

  /* 捲動平滑與細捲軸 */
  html { scroll-behavior: smooth; }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

  /* 👇 手機版 RWD 樣式機制（解決螢幕擠壓問題） */
  .mobile-only { display: none !important; }
  .resize-handle { position: relative; width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent; transition: background 0.15s; }
  .resize-handle:hover { background: var(--accent); }
  .resize-toggle {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 16px; height: 42px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-surface);
    color: var(--text-faint); font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-xs); z-index: 5; padding: 0;
  }
  .resize-toggle:hover { color: var(--accent); border-color: var(--accent); }

  /* 任務列表：欄位變窄時圖示收合成「⋯」選單，文字保有完整寬度 */
  .task-main-col { container-type: inline-size; }
  .task-actions-inline { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .task-actions-collapsed { display: none; position: relative; flex-shrink: 0; }
  .task-actions-toggle {
    list-style: none; cursor: pointer; width: 26px; height: 26px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 15px;
  }
  .task-actions-toggle::-webkit-details-marker { display: none; }
  .task-actions-toggle:hover { background: var(--bg-hover); color: var(--accent); }
  .task-actions-collapsed[open] .task-actions-toggle { background: var(--accent-soft); color: var(--accent); }
  .task-actions-panel {
    position: absolute; top: 100%; right: 0; margin-top: 4px; z-index: 20;
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-md);
    padding: 6px; display: flex; align-items: center; gap: 4px;
  }
  @container (max-width: 300px) {
    .task-actions-inline { display: none !important; }
    .task-actions-collapsed { display: inline-block !important; }
  }
  @media (max-width: 768px) {
    .hide-on-mobile { display: none !important; }
    .mobile-full-width {
      width: 100% !important;
      max-width: 100% !important;
      flex: 1 1 100% !important;
      border-right: none !important;
      display: flex !important;
    }
    .mobile-only { display: inline-flex !important; align-items: center; justify-content: center; }
    input, select, textarea { font-size: 16px !important; }
    button { min-height: 38px; }
    .btn-icon { min-height: 32px; min-width: 32px; }
    .tap-icon { padding: 8px !important; margin: -8px !important; }
    .note-actions-row { display: flex !important; flex-wrap: wrap !important; gap: 6px !important; }
    .fmt-bar-mobile { flex-wrap: nowrap !important; overflow-x: auto !important; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 6px !important; }
    .fmt-bar-mobile::-webkit-scrollbar { display: none; }
    .fmt-bar-mobile > div { flex-wrap: nowrap !important; flex-shrink: 0; }
    .toolbar-collapse-handle {
      display: flex !important; align-items: center; justify-content: center; gap: 4px;
      width: 100%; margin: 0 0 8px; padding: 5px 0; min-height: 0 !important;
      background: var(--bg-subtle); border: 1px dashed var(--border-strong) !important; border-radius: 8px;
      color: var(--text-muted); font-size: 12px; cursor: pointer;
    }
    .toolbar-collapse-handle:active { color: var(--accent); border-color: var(--accent) !important; }
    .toolbar-collapsible-hide { display: none !important; }
    .img-float-bar {
      top: auto !important; left: 8px !important; right: 8px !important; bottom: 12px !important;
      flex-wrap: wrap !important; justify-content: center !important; white-space: normal !important;
      padding: 6px 8px !important; gap: 4px !important;
    }
    .toast-stack { top: auto; bottom: 16px; left: 16px; right: 16px; max-width: none; }
  }
  .note-body { font-family: inherit; }
  .note-body:empty::before { content: attr(data-placeholder); color: var(--text-faint); pointer-events: none; display: block; }
  .note-body ul, .note-body ol { padding-left: 1.5em; margin: 4px 0; }
  .note-body li { margin: 2px 0; }
  .note-body blockquote { margin: 6px 0 6px 1.2em; padding-left: 10px; border-left: 3px solid var(--border-strong); color: var(--text-muted); }
  .note-body img[data-inline] { max-width: 100%; border-radius: 8px; cursor: pointer; display: block; margin: 8px 0; -webkit-touch-callout: none; }
  .note-body img[data-inline]:hover { outline: 2px solid var(--accent); }
  .note-body img[data-inline].img-sel { outline: 2px solid var(--accent); }
  .note-body img[data-inline].img-border { border: 2px solid var(--text-muted); }
  .note-body { overflow: hidden; position: relative; }
  .note-body-readmode { cursor: default; }
  .note-body-readmode img[data-inline] { cursor: default; }
  .note-body img[data-inline].img-row { float: left !important; margin: 3px 1% 8px 0 !important; }
  .note-body img[data-inline].img-free { position: absolute; float: none !important; margin: 0 !important; cursor: move; z-index: 5; }
  .note-body .li1 { margin: 3px 0; }
  .note-body .li2 { padding-left: 2em; margin: 3px 0; }
  .note-body .li3 { padding-left: 4em; margin: 3px 0; }
  .note-body li[data-toggle="1"] { list-style: none; }
  .note-body .li-toggle-mark { display: inline-block; width: 12px; margin-right: 2px; cursor: pointer;
    user-select: none; font-size: 9px; color: var(--text-muted); vertical-align: middle; }
  .note-body .li-toggle-mark::before { content: '▼'; }
  .note-body [data-collapsed="1"] > .li-toggle-mark::before { content: '▶'; }
  .note-body [data-li-hidden="1"] { display: none !important; }
  .note-body .page-break { display: block; text-align: center; font-size: 12.5px; font-weight: 600; color: var(--accent);
    padding: 8px 0; margin: 14px 0; border-top: 2px dashed var(--accent); border-bottom: 2px dashed var(--accent); background: var(--accent-soft); user-select: none; cursor: pointer; border-radius: 4px; }
  .note-body .page-break.break-sel { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  .note-body .print-stop { display: block; text-align: center; font-size: 12.5px; font-weight: 600; color: var(--warning);
    padding: 8px 0; margin: 14px 0; border-top: 2px dashed var(--warning); border-bottom: 2px dashed var(--warning); background: var(--warning-soft); user-select: none; cursor: pointer; border-radius: 4px; }
  .note-body .print-stop.break-sel { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  .note-body table.side-by-side { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 8px 0; }
  .note-body table.side-by-side td.sbs-col { vertical-align: top; padding: 10px 12px; border: 1px dashed var(--border-strong); border-radius: 4px; min-width: 0; outline: none; }
  .note-body table.side-by-side td.sbs-col:focus { border-color: var(--accent); }
  .note-body .note-tag { display: inline-flex; align-items: center; gap: 3px; background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--accent-border); border-radius: 999px; padding: 1px 10px; font-size: 0.92em; font-weight: 500; cursor: pointer; user-select: none; white-space: nowrap; }
  .note-body .note-tag:hover { filter: brightness(0.96); }
  .note-fontsize-input::-webkit-inner-spin-button,
  .note-fontsize-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .note-fontsize-input { -moz-appearance: textfield; }
  .print-only-title { display: none; }
  @media print {
    .note-body, .note-body * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
    aside, section, .resize-handle, .no-print, .toast-stack { display: none !important; }
    .print-only-title { display: block !important; font-size: 22px; font-weight: 700; color: #1f2937; margin: 0 0 12px; padding: 0; }
    html, body { height: auto !important; background: white !important; color: #1f2937 !important; }
    #root > div { height: auto !important; overflow: visible !important; display: block !important; background: white !important; }
    main { overflow: visible !important; height: auto !important; flex: none !important; display: block !important; background: white !important; }
    main > div { overflow: visible !important; height: auto !important; flex: none !important; background: white !important; }
    .note-body { overflow: visible !important; min-height: 0 !important; max-height: none !important; border: none !important; border-radius: 0 !important; background: white !important; color: #1f2937 !important; box-shadow: none !important; }
    .note-body [data-li-hidden="1"] { display: block !important; }
    .note-body .li-toggle-mark { display: none !important; }
    .note-body img[data-inline]:hover, .note-body img[data-inline].img-sel { outline: none !important; }
    .note-body img[data-inline] { cursor: default !important; break-inside: avoid; }
    .note-body table.side-by-side { break-inside: avoid; }
    .note-body table.side-by-side td.sbs-col { border-style: solid; border-color: #e5e7eb; }
    .note-body .note-tag { cursor: default !important; }
    .note-body .page-break { page-break-before: always; break-before: page; border: none !important;
      padding: 0 !important; margin: 0 !important; height: 0 !important; font-size: 0 !important; color: transparent !important; overflow: hidden; }
    .note-body .print-stop, .note-body .print-stop ~ * { display: none !important; }
    @page { margin: 18mm; size: A4; }
  }
</style>
</head>

<div id="root"></div>

    "firebase/app": "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js",

async function uploadImageBlob(path, blob) {

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = document.createElement('img');
      img.onload = () => {
        const scale = Math.min(1, MAX_IMG_WIDTH / img.width);
        const w = Math.round(img.width * scale);
        const hh = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = hh;
        canvas.getContext('2d').drawImage(img, 0, 0, w, hh);
        let q = JPG_QUALITY;
        let dataUrl;
        // 存到 Storage 不用再為了塞進 Firestore 硬壓到 600KB 以下，這裡只留一個很寬的
        // 安全上限（4MB），避免極端情況（超高畫素原始照片）沒必要地佔用空間和上傳時間，
        // 正常照片在目前的畫質設定下不會觸發這個迴圈
        do {
          dataUrl = canvas.toDataURL('image/jpeg', q);
          q = Math.round((q - 0.1) * 10) / 10;
        } while (dataUrl.length > 4000000 && q >= 0.5);
        resolve(dataUrl);
      };
      img.onerror = () => reject(new Error('圖片解析失敗'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('檔案讀取失敗'));
    reader.readAsDataURL(file);
  });
}

function rotateImageData(src, deg) {
  return new Promise((resolve, reject) => {
    const img = document.createElement('img');
    // src 可能是 data: URI（舊資料）或 Firebase Storage 網址（新資料）。
    // 跨網域來源要設 crossOrigin，不然畫到 canvas 上會被標記為「不透明」，
    // 沒辦法用 toDataURL 讀出結果（data: URI 本來就同源，這個設定對它沒影響）。
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const swap = deg === 90 || deg === 270;
      const canvas = document.createElement('canvas');
      canvas.width = swap ? img.height : img.width;
      canvas.height = swap ? img.width : img.height;
      const ctx = canvas.getContext('2d');
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate((deg * Math.PI) / 180);
      ctx.drawImage(img, -img.width / 2, -img.height / 2);
      resolve(canvas.toDataURL('image/jpeg', JPG_QUALITY));
    };
    img.onerror = () => reject(new Error('旋轉失敗'));
    img.src = src;
  });
}

const BODY_TAG_WHITELIST = /<(br|p|div|b|i|u|s|span|ul|ol|li|strong|em|blockquote|img|mark)\b/i;

function toBodyHtml(body) {
  if (!body) return '';
  if (BODY_TAG_WHITELIST.test(body)) return body;
  // 舊版判斷「這段是不是已經是 HTML」的標籤清單漏了 <img>：筆記如果只有一張圖、
  // 沒有其他 br/div 包著（例如貼上圖片就是內容的第一個東西），整段會被誤判成純文字
  // 整個跳脫，畫面上就會看到 &lt;img data-inline=...&gt; 這種亂碼。之後每次編輯存檔
  // 又會再跳脫一次，越疊越多層。這裡嘗試反覆解跳脫，能認出標籤就當作救回來了。
  let decoded = body;
  for (let i = 0; i < 5; i++) {
    const next = decoded.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
    if (next === decoded) break;
    decoded = next;
    if (BODY_TAG_WHITELIST.test(decoded)) return decoded;
  }
  return body
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}

// 從 markEl 往上走到 rootEl，每一層都把「這一層之後的兄弟節點」收集起來（含 markEl 自己）。
// 這樣不管 markEl 實際巢狀在第幾層（例如編輯歷史留下的無樣式包裹 <div>），都能正確找出
// 「文件順序上在 markEl 之後的所有內容」，不像純 CSS 的一般兄弟選擇器只看得到同一層的兄弟。
function collectNodesAfterMarker(markEl, rootEl) {
  const nodes = [markEl];
  let node = markEl;
  while (node && node !== rootEl) {
    let sib = node.nextElementSibling;
    while (sib) { nodes.push(sib); sib = sib.nextElementSibling; }
    node = node.parentElement;
  }
  return nodes;
}

// 「以下不印」標記如果緊接在「✂ 分頁」換頁標記後面（中間可能還夾著幾個空白行），
// 這個換頁標記逼出來的新頁面會因為後面全部被隱藏而變成一頁空白。從標記往前找，
// 只要還沒遇到真正有內容（文字或圖片）的節點，遇到的分頁標記就一併視為要隱藏。
// 一旦遇到有內容的節點就停止，代表那一頁真的有東西要印，分頁標記要保留。
function collectTrailingPageBreaks(markEl, rootEl) {
  const extra = [];
  let seenContent = false;
  let node = markEl;
  while (node && node !== rootEl) {
    let prev = node.previousElementSibling;
    while (prev) {
      if (!seenContent && prev.classList?.contains('page-break')) {
        extra.push(prev);
      } else if ((prev.textContent || '').trim() || prev.querySelector?.('img')) {
        seenContent = true;
      }
      prev = prev.previousElementSibling;
    }
    node = node.parentElement;
  }
  return extra;
}

function stripHtml(html) {
  if (!html) return '';
  return html.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]*>/g, '')
    .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&nbsp;/g, ' ').trim();
}

function Icon({ name, size = 15, strokeWidth = 1.85, color, style }) {
  const path = ICON_PATHS[name];
  if (!path) return null;
  return h('svg', {
    width: size, height: size, viewBox: '0 0 24 24', fill: 'none',
    stroke: color || 'currentColor', strokeWidth, strokeLinecap: 'round', strokeLinejoin: 'round',
    style: { flexShrink: 0, display: 'inline-block', verticalAlign: 'middle', ...style },
    dangerouslySetInnerHTML: { __html: path },
  });
}

function Login() {
  const [email, setEmail] = useState('');
  const [pwd, setPwd] = useState('');
  const [isSignup, setIsSignup] = useState(false);
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  const google = async () => {
    setErr(''); setLoading(true);
    try {
      await signInWithPopup(auth, googleProvider);
    } catch (e) {
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request' || e.code === 'auth/operation-not-supported-in-this-environment') {
        try { await signInWithRedirect(auth, googleProvider); return; }
        catch (e2) { setErr('登入失敗：' + e2.message); }
      } else setErr('登入失敗：' + e.message);
      setLoading(false);
    }
  };

  const emailLogin = async (e) => {
    e.preventDefault();
    setErr(''); setLoading(true);
    try {
      if (isSignup) await createUserWithEmailAndPassword(auth, email, pwd);
      else await signInWithEmailAndPassword(auth, email, pwd);
    } catch (e) {
      let msg = e.message;
      if (e.code === 'auth/network-request-failed') msg = '帳號不存在或密碼錯誤。若是首次使用請點下方建立新帳號。';
      setErr(msg);
    } finally { setLoading(false); }
  };

  const L = {
    wrap: { minHeight: '100dvh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--bg-app)', padding: 20 },

    divider: { display: 'flex', alignItems: 'center', margin: '18px 0', gap: 10 },

    input: { width: '100%', padding: '11px 14px', border: '1px solid var(--border)', borderRadius: 10, fontSize: 14, marginBottom: 10, outline: 'none', background: 'var(--bg-surface)', color: 'var(--text-primary)' },
    primaryBtn: { width: '100%', padding: '11px', background: 'var(--accent)', color: '#fff', border: 'none', borderRadius: 10, cursor: 'pointer', fontSize: 14, fontWeight: 600 },
    linkBtn: { width: '100%', marginTop: 14, padding: 8, background: 'none', border: 'none', color: 'var(--accent)', cursor: 'pointer', fontSize: 13, fontWeight: 500 },
    err: { marginTop: 14, padding: 10, background: 'var(--danger-soft)', color: 'var(--danger)', border: '1px solid var(--danger-border)', borderRadius: 8, fontSize: 12.5 },
  };

  return h('div', { style: L.wrap },
    h('div', { style: L.card },
      h('div', { style: { width: 44, height: 44, borderRadius: 12, background: 'var(--accent)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto' } },
        h(Icon, { name: 'camera', size: 22 })),
      h('h1', { style: L.title }, '照片筆記'),
      h('p', { style: L.sub }, '登入後可在電腦和手機間即時同步'),
      h('button', { className: 'btn-ghost', onClick: google, disabled: loading, style: L.googleBtn },
        h('span', { style: { fontSize: 16, fontWeight: 700, color: '#4285f4' } }, 'G'), '使用 Google 登入'),
      h('div', { style: L.divider },
        h('div', { style: L.line }), h('span', { style: L.dt }, '或'), h('div', { style: L.line })),

        h('input', { type: 'password', placeholder: '密碼 (至少 6 字)', value: pwd, onChange: e => setPwd(e.target.value), required: true, minLength: 6, style: L.input }),

function useEscClose(onCancel) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onCancel?.(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onCancel]);
}

function CompleteTaskModal({ task, notes, onConfirm, onCancel, zIndex }) {
  useEscClose(onCancel);
  const [reason, setReason] = useState('');
  const [relay, setRelay] = useState(false);
  const [relayTitle, setRelayTitle] = useState('');
  const [relayDueDate, setRelayDueDate] = useState('');
  const [relayReminderOffset, setRelayReminderOffset] = useState('');
  const [relayRecur, setRelayRecur] = useState('');
  const [relayRecurInterval, setRelayRecurInterval] = useState('7');
  const [relayNoteIds, setRelayNoteIds] = useState([]);
  const [loading, setLoading] = useState(false);

  const toggleRelayNote = (id) => setRelayNoteIds(cur => cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id]);
  const relayBlocked = relay && !relayTitle.trim();

  const submit = async () => {
    if (!reason.trim() || loading || relayBlocked) return;
    setLoading(true);
    try {
      const relayPayload = relay ? {
        title: relayTitle.trim(),
        dueDate: relayDueDate || null,
        reminderOffset: relayReminderOffset !== '' ? parseInt(relayReminderOffset) : null,
        recur: relayDueDate && relayRecur ? relayRecur : null,
        recurInterval: relayDueDate && relayRecur === 'custom' ? (parseInt(relayRecurInterval) || 7) : null,
        noteIds: relayNoteIds,
      } : null;
      await onConfirm(reason.trim(), relayPayload);
    } catch (err) {
      setLoading(false);
    }
  };

  return h('div', { className: 'modal-overlay', style: { ...S.modalOverlay, ...(zIndex ? { zIndex } : {}) }, onClick: (e) => e.target === e.currentTarget && onCancel() },

        h(Icon, { name: 'repeat', size: 14, color: 'var(--accent)' }),
        h('span', null, '任務接力（完成後建立後續任務）')
      ),
      relay && h('div', { style: { marginTop: 8, padding: '12px', borderRadius: 10, background: 'var(--bg-subtle)', marginBottom: 12 } },
        h('label', { style: { fontSize: 12, color: 'var(--text-muted)', display: 'block', marginBottom: 4 } }, '後續任務內容'),

        h('label', { style: { fontSize: 12, color: 'var(--text-muted)', display: 'block', marginBottom: 4 } }, '截止日期 / 時間（選填）'),
        h('input', { type: 'datetime-local', value: relayDueDate, onChange: e => setRelayDueDate(e.target.value),
          style: { ...S.modalInput, fontSize: 13 }, disabled: loading }),
        relayDueDate && h('div', { style: { marginBottom: 12 } },

function CalendarView({ tasks, selectedDate, onSelectDate, wide = false, colorMap = null }) {
  const today = new Date();
  const [viewYear, setViewYear] = useState(selectedDate ? selectedDate.getFullYear() : today.getFullYear());
  const [viewMonth, setViewMonth] = useState(selectedDate ? selectedDate.getMonth() : today.getMonth());

  useEffect(() => {
    if (selectedDate) { setViewYear(selectedDate.getFullYear()); setViewMonth(selectedDate.getMonth()); }
  }, [selectedDate]);

  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();

  const tasksByDate = {};
  tasks.forEach(t => {
    if (!t.dueDate || t.deleted) return;
    const d = new Date(t.dueDate);
    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    if (!tasksByDate[key]) tasksByDate[key] = [];
    tasksByDate[key].push(t);
  });
  const viewStart = new Date(viewYear, viewMonth, 1);
  const viewEnd = new Date(viewYear, viewMonth + 1, 0, 23, 59, 59);
  tasks.forEach(t => {
    if (!t.recur || !t.dueDate || t.deleted || t.done) return;
    let cur = nextOccurrenceDate(t.dueDate, t.recur, t.recurInterval);
    let steps = 0;
    while (cur < viewStart && steps < 500) { cur = nextOccurrenceDate(cur, t.recur, t.recurInterval); steps++; }
    while (cur <= viewEnd && steps < 600) {
      const rKey = `${cur.getFullYear()}-${cur.getMonth()}-${cur.getDate()}`;
      if (!tasksByDate[rKey]) tasksByDate[rKey] = [];
      if (!tasksByDate[rKey].find(x => x.id === t.id)) tasksByDate[rKey].push({ ...t, _recurVirtual: true });
      cur = nextOccurrenceDate(cur, t.recur, t.recurInterval);
      steps++;
    }
  });

  const prevM = () => { if (viewMonth === 0) { setViewYear(y => y-1); setViewMonth(11); } else setViewMonth(m => m-1); };
  const nextM = () => { if (viewMonth === 11) { setViewYear(y => y+1); setViewMonth(0); } else setViewMonth(m => m+1); };
  const goToday = () => {
    const now = new Date();
    setViewYear(now.getFullYear());
    setViewMonth(now.getMonth());
    onSelectDate(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
  };

  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  return h('div', { style: { padding: wide ? '14px 20px' : '10px 12px', maxWidth: wide ? 1120 : 'none', margin: wide ? '0 auto' : 0 } },
    h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: wide ? 12 : 8, gap: 8 } },

function renderStrokesScaled(ctx, strokes, ratio) {
  for (const s of (strokes || [])) {
    if (!s || !s.color) continue;
    ctx.strokeStyle = s.color; ctx.fillStyle = s.color;
    ctx.lineWidth = s.width * ratio; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (s.type === 'pen') {
      ctx.beginPath();
      s.points.forEach((p, i) => (i ? ctx.lineTo(p.x * ratio, p.y * ratio) : ctx.moveTo(p.x * ratio, p.y * ratio)));
      ctx.stroke();
    } else if (s.type === 'rect') {
      ctx.strokeRect(s.x0 * ratio, s.y0 * ratio, (s.x1 - s.x0) * ratio, (s.y1 - s.y0) * ratio);
    } else if (s.type === 'arrow') {
      const x0 = s.x0*ratio, y0 = s.y0*ratio, x1 = s.x1*ratio, y1 = s.y1*ratio;
      const head = (10 + s.width * 2) * ratio;
      const ang = Math.atan2(y1 - y0, x1 - x0);
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x1, y1);
      ctx.lineTo(x1 - head * Math.cos(ang - Math.PI/6), y1 - head * Math.sin(ang - Math.PI/6));
      ctx.lineTo(x1 - head * Math.cos(ang + Math.PI/6), y1 - head * Math.sin(ang + Math.PI/6));
      ctx.closePath(); ctx.fill();
    } else if (s.type === 'ellipse') {
      const rx = Math.abs(s.x1 - s.x0) / 2 * ratio, ry = Math.abs(s.y1 - s.y0) / 2 * ratio;
      if (rx > 0.5 && ry > 0.5) { ctx.beginPath(); ctx.ellipse((s.x0+s.x1)/2*ratio, (s.y0+s.y1)/2*ratio, rx, ry, 0, 0, Math.PI*2); ctx.stroke(); }
    } else if (s.type === 'line') {
      ctx.beginPath(); ctx.moveTo(s.x0*ratio, s.y0*ratio); ctx.lineTo(s.x1*ratio, s.y1*ratio); ctx.stroke();
    } else if (s.type === 'highlight') {
      ctx.save(); ctx.globalAlpha = 0.38; ctx.fillStyle = s.color;
      ctx.fillRect(Math.min(s.x0,s.x1)*ratio, Math.min(s.y0,s.y1)*ratio, Math.abs(s.x1-s.x0)*ratio, Math.abs(s.y1-s.y0)*ratio);
      ctx.restore();
    } else if (s.type === 'text') {
      ctx.font = `${s.size * ratio}px -apple-system,"PingFang TC",sans-serif`;
      ctx.textBaseline = 'top';
      ctx.fillText(s.text, s.x * ratio, s.y * ratio);
    }
  }
}

function renderImageToDataUrl(im) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous'; // 讀 Storage 網址時要設，才能之後 toDataURL
    img.onload = () => {
      const maxW = MAX_IMG_WIDTH;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      if (im.grayscale) {
        ctx.filter = 'grayscale(100%)';
        ctx.drawImage(img, 0, 0, w, h);
        ctx.filter = 'none';
      } else {
        ctx.drawImage(img, 0, 0, w, h);
      }
      if (im.strokes?.length) {
        const annotatorScale = Math.min(1, MAX_IMG_WIDTH / img.width);
        const ratio = w / (img.width * annotatorScale);
        renderStrokesScaled(ctx, im.strokes, ratio);
      }
      resolve(c.toDataURL('image/jpeg', JPG_QUALITY));
    };
    img.src = im.url || im.dataUrl;
  });
}

function PhotoAnnotator({ src, initialStrokes, initialGrayscale, onSave, onClose }) {
  const canvasRef = useRef(null);
  const imgRef = useRef(null);
  const [tool, setTool] = useState("pen");
  const [color, setColor] = useState("#ef4444");
  const [width, setWidth] = useState(4);
  const [eraserSize, setEraserSize] = useState(24);
  const [fillShape, setFillShape] = useState(false);
  const [fontSize, setFontSize] = useState(28);
  const [strokes, setStrokes] = useState((initialStrokes || []).filter(Boolean));
  const [redoStack, setRedoStack] = useState([]);
  const [grayscale, setGrayscale] = useState(!!initialGrayscale);
  const drawingRef = useRef(false);
  const cur = useRef(null);
  const layerRef = useRef(null);   // 筆跡圖層：橡皮擦只擦這層，不會擦到底下的照片
  const innerRef = useRef(null);
  const cursorRef = useRef(null);  // 筆刷/橡皮擦範圍圈
  const grayCanvasRef = useRef(null);
  const canvasWrapRef = useRef(null);
  const panStart = useRef(null);
  const [textInput, setTextInput] = useState(null);
  const [imgDims, setImgDims] = useState({ w: 0, h: 0 });
  const [zoom, setZoom] = useState(1);
  const [selectedId, setSelectedId] = useState(null); // 剛畫完、還能搬移/調整的那個物件
  const selDragRef = useRef(null);
  const [dispScale, setDispScale] = useState(1); // 畫布實際顯示尺寸 / 內部像素尺寸，讓打字中的文字大小跟完成後一致

  useEffect(() => {
    const el = canvasRef.current;
    if (!el) return;
    const update = () => {
      if (el.width) setDispScale(el.getBoundingClientRect().width / el.width);
    };
    update();
    const ro = new ResizeObserver(update);
    ro.observe(el);
    return () => ro.disconnect();
  }, [imgDims, zoom]);

  useEffect(() => {
    const img = document.createElement("img");
    img.crossOrigin = 'anonymous'; // 之後要 getImageData 做灰階，讀 Storage 網址時一定要設
    img.onload = () => {
      const maxW = 1400;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      setImgDims({ w, h });
      imgRef.current = img;
      const gc = document.createElement('canvas');
      gc.width = w; gc.height = h;
      const gctx = gc.getContext('2d');
      gctx.drawImage(img, 0, 0, w, h);
      const id = gctx.getImageData(0, 0, w, h);
      const d = id.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = Math.round(0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]);
        d[i] = d[i+1] = d[i+2] = v;
      }
      gctx.putImageData(id, 0, 0);
      grayCanvasRef.current = gc;
    };
    img.src = src;
  }, [src]);

  const drawStroke = (ctx, s) => {
    if (!s || !s.color) return;
    ctx.strokeStyle = s.color; ctx.fillStyle = s.color;
    ctx.lineWidth = s.width; ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (s.type === "pen" || s.type === "erase") {
      if (s.points.length === 1) {
        ctx.beginPath(); ctx.arc(s.points[0].x, s.points[0].y, s.width / 2, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath();
        s.points.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
        ctx.stroke();
      }
    } else if (s.type === "rect") {
      if (s.fill) ctx.fillRect(s.x0, s.y0, s.x1 - s.x0, s.y1 - s.y0);
      else ctx.strokeRect(s.x0, s.y0, s.x1 - s.x0, s.y1 - s.y0);
    } else if (s.type === "arrow") {
      const head = 10 + s.width * 2;
      const ang = Math.atan2(s.y1 - s.y0, s.x1 - s.x0);
      ctx.beginPath(); ctx.moveTo(s.x0, s.y0); ctx.lineTo(s.x1, s.y1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1);
      ctx.lineTo(s.x1 - head * Math.cos(ang - Math.PI / 6), s.y1 - head * Math.sin(ang - Math.PI / 6));
      ctx.lineTo(s.x1 - head * Math.cos(ang + Math.PI / 6), s.y1 - head * Math.sin(ang + Math.PI / 6));
      ctx.closePath(); ctx.fill();
    } else if (s.type === "ellipse") {
      const rx = Math.abs(s.x1 - s.x0) / 2, ry = Math.abs(s.y1 - s.y0) / 2;
      if (rx > 0.5 && ry > 0.5) {
        ctx.beginPath(); ctx.ellipse((s.x0+s.x1)/2, (s.y0+s.y1)/2, rx, ry, 0, 0, Math.PI*2);
        if (s.fill) ctx.fill(); else ctx.stroke();
      }
    } else if (s.type === "line") {
      ctx.beginPath(); ctx.moveTo(s.x0, s.y0); ctx.lineTo(s.x1, s.y1); ctx.stroke();
    } else if (s.type === "highlight") {
      ctx.save(); ctx.globalAlpha = 0.38; ctx.fillStyle = s.color;
      ctx.fillRect(Math.min(s.x0,s.x1), Math.min(s.y0,s.y1), Math.abs(s.x1-s.x0), Math.abs(s.y1-s.y0));
      ctx.restore();
    } else if (s.type === "text") {
      ctx.font = `${s.size}px -apple-system, "PingFang TC", sans-serif`;
      ctx.textBaseline = "top";
      const lh = s.size * 1.3;
      (s.text || '').split('\n').forEach((line, i) => ctx.fillText(line, s.x, s.y + i * lh));
    }
  };

  // 選取物件的範圍框（畫布座標）：pen/erase 用點位範圍，其他形狀用 x0,y0,x1,y1
  const strokeBounds = (s) => {
    if (s.type === "pen" || s.type === "erase") {
      const xs = s.points.map((p) => p.x), ys = s.points.map((p) => p.y);
      return { x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys) };
    }
    if (s.type === "text") {
      const { w, h } = measureTextStroke(s);
      return { x0: s.x, y0: s.y, x1: s.x + w, y1: s.y + h };
    }
    return { x0: Math.min(s.x0, s.x1), y0: Math.min(s.y0, s.y1), x1: Math.max(s.x0, s.x1), y1: Math.max(s.y0, s.y1) };
  };

  const measureTextStroke = (s) => {
    const ctx = canvasRef.current?.getContext("2d");
    const lines = (s.text || "").split("\n");
    if (!ctx) return { w: 0, h: lines.length * s.size * 1.3 };
    ctx.font = `${s.size}px -apple-system, "PingFang TC", sans-serif`;
    const w = Math.max(1, ...lines.map((l) => ctx.measureText(l).width));
    return { w, h: lines.length * s.size * 1.3 };
  };

  // 回傳點 p 打在選取物件的哪個部位："move" 搬移整體、"p0"/"p1" 拖拉端點調整形狀
  const hitTestSelected = (p, s) => {
    const HANDLE_R = 14, PAD = 10;
    if (s.type !== "text" && s.type !== "pen" && s.type !== "erase") {
      if (Math.hypot(p.x - s.x0, p.y - s.y0) <= HANDLE_R) return "p0";
      if (Math.hypot(p.x - s.x1, p.y - s.y1) <= HANDLE_R) return "p1";
    }
    const b = strokeBounds(s);
    if (p.x >= b.x0 - PAD && p.x <= b.x1 + PAD && p.y >= b.y0 - PAD && p.y <= b.y1 + PAD) return "move";
    return null;
  };

  const drawSelectionUI = (ctx, s) => {
    const b = strokeBounds(s);
    ctx.save();
    ctx.setLineDash([6, 4]);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#0ea5e9";
    ctx.strokeRect(b.x0 - 6, b.y0 - 6, (b.x1 - b.x0) + 12, (b.y1 - b.y0) + 12);
    ctx.setLineDash([]);
    if (s.type !== "text" && s.type !== "pen" && s.type !== "erase") {
      [[s.x0, s.y0], [s.x1, s.y1]].forEach(([hx, hy]) => {
        ctx.beginPath(); ctx.arc(hx, hy, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#0ea5e9"; ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = "#fff"; ctx.stroke();
      });
    }
    ctx.restore();
  };

  const redraw = useCallback(() => {
    const c = canvasRef.current;
    if (!c || !imgRef.current) return;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    const base = (grayscale && grayCanvasRef.current) ? grayCanvasRef.current : imgRef.current;
    ctx.drawImage(base, 0, 0, c.width, c.height);
    // 筆跡先畫在獨立圖層，橡皮擦用 destination-out 只擦圖層上的筆跡，再整層貼到照片上
    const layer = layerRef.current || (layerRef.current = document.createElement("canvas"));
    if (layer.width !== c.width || layer.height !== c.height) { layer.width = c.width; layer.height = c.height; }
    const lctx = layer.getContext("2d");
    lctx.clearRect(0, 0, layer.width, layer.height);
    const all = cur.current ? [...strokes, cur.current] : strokes;
    for (const s of all) {
      lctx.globalCompositeOperation = s.type === "erase" ? "destination-out" : "source-over";
      drawStroke(lctx, s);
    }
    lctx.globalCompositeOperation = "source-over";
    ctx.drawImage(layer, 0, 0);
    if (selectedId && !cur.current) {
      const sel = strokes.find((s) => s.id === selectedId);
      if (sel) drawSelectionUI(ctx, sel);
    }
  }, [strokes, grayscale, selectedId]);

  useEffect(() => { redraw(); }, [redraw, imgDims]);

  const pos = (e) => {
    const r = canvasRef.current.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {
      x: (t.clientX - r.left) * (canvasRef.current.width / r.width),
      y: (t.clientY - r.top) * (canvasRef.current.height / r.height),
    };
  };

  const hideCursor = () => { if (cursorRef.current) cursorRef.current.style.display = "none"; };

  // 畫筆/橡皮擦的範圍圈：直徑 = 筆寬換算成螢幕像素（會跟著縮放變化）
  const updateCursor = (e) => {
    const el = cursorRef.current, c = canvasRef.current, box = innerRef.current;
    if (!el || !c || !box) return;
    if (tool !== "pen" && tool !== "erase") { el.style.display = "none"; return; }
    const t = e.touches ? e.touches[0] : e;
    if (!t) return;
    const r = c.getBoundingClientRect(), br = box.getBoundingClientRect();
    const d = Math.max(4, (tool === "erase" ? eraserSize : width) * r.width / c.width);
    el.style.width = el.style.height = d + "px";
    el.style.left = (t.clientX - br.left) + "px";
    el.style.top = (t.clientY - br.top) + "px";
    el.style.display = "block";
  };

  // Ctrl+Z 復原、Ctrl+Shift+Z / Ctrl+Y 重做、Delete 刪除選取物件、Esc 關閉
  useEffect(() => {
    const onKey = (e) => {

          if (!s.length) return s;
          const last = s[s.length - 1];
          setRedoStack((r) => [...r, last]);
          return s.slice(0, -1);
        });
        setSelectedId(null);
      } else if ((e.ctrlKey || e.metaKey) && !e.altKey && ((k === "z" && e.shiftKey) || k === "y")) {
        e.preventDefault(); e.stopPropagation();

          if (!r.length) return r;

          setStrokes((s) => [...s, next]);
          return r.slice(0, -1);
        });

        e.preventDefault(); e.stopPropagation();

          const target = s.find((x) => x.id === selectedId);
          if (target) setRedoStack((r) => [...r, target]);
          return s.filter((x) => x.id !== selectedId);

        setSelectedId(null);
      } else if (e.key === "Escape") {
        e.preventDefault(); e.stopPropagation();
        if (selectedId) setSelectedId(null);
        else onClose();
      }
    };
    window.addEventListener("keydown", onKey, true);
    return () => window.removeEventListener("keydown", onKey, true);
  }, [selectedId, onClose]);

  const start = (e) => {
    e.preventDefault();
    if (e.touches?.length >= 2) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      panStart.current = {
        midX: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        midY: (e.touches[0].clientY + e.touches[1].clientY) / 2,
        scrollLeft: canvasWrapRef.current?.scrollLeft || 0,
        scrollTop: canvasWrapRef.current?.scrollTop || 0,
        dist,
        initZoom: zoom,
      };
      return;
    }
    panStart.current = null;
    const p = pos(e);

    // 點在剛完成的物件範圍內就搬移/調整它，而不是開始畫新的；點別處才取消選取
    if (selectedId) {
      const sel = strokes.find((s) => s.id === selectedId);
      if (sel) {
        const hit = hitTestSelected(p, sel);
        if (hit) {
          selDragRef.current = { mode: hit, start: p, orig: JSON.parse(JSON.stringify(sel)) };
          return;
        }
      }
      setSelectedId(null);
    }

    if (tool === "text") {
      commitText(); // 先把上一個還沒完成的文字框存檔，再開新的，不然會被蓋掉消失
      setTextInput({ x: p.x, y: p.y, value: "" });
      return;
    }
    drawingRef.current = true;
    if (tool === "pen" || tool === "erase") {
      cur.current = { id: uid(), type: tool, color: tool === "erase" ? "#000" : color, width: tool === "erase" ? eraserSize : width, points: [p] };
      updateCursor(e);
      redraw(); // 單點輕點也要立刻顯示
    }
    else cur.current = { id: uid(), type: tool, color, width, fill: fillShape, x0: p.x, y0: p.y, x1: p.x, y1: p.y };
  };

  const move = (e) => {
    e.preventDefault();
    if (e.touches?.length >= 2) hideCursor(); else updateCursor(e);
    if (panStart.current && e.touches?.length >= 2) {
      const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      if (canvasWrapRef.current) {
        canvasWrapRef.current.scrollLeft = panStart.current.scrollLeft - (midX - panStart.current.midX);
        canvasWrapRef.current.scrollTop = panStart.current.scrollTop - (midY - panStart.current.midY);
      }
      const newZoom = Math.max(0.25, Math.min(4, panStart.current.initZoom * (dist / panStart.current.dist)));
      setZoom(+(newZoom.toFixed(2)));
      return;
    }
    if (selDragRef.current) {
      const p = pos(e);
      const { mode, start: st, orig } = selDragRef.current;
      const dx = p.x - st.x, dy = p.y - st.y;
      setStrokes((arr) => arr.map((s) => {
        if (s.id !== orig.id) return s;
        if (mode === "p0") return { ...orig, x0: orig.x0 + dx, y0: orig.y0 + dy };
        if (mode === "p1") return { ...orig, x1: orig.x1 + dx, y1: orig.y1 + dy };
        if (orig.type === "pen" || orig.type === "erase") {
          return { ...orig, points: orig.points.map((pt) => ({ x: pt.x + dx, y: pt.y + dy })) };
        }
        if (orig.type === "text") return { ...orig, x: orig.x + dx, y: orig.y + dy };
        return { ...orig, x0: orig.x0 + dx, y0: orig.y0 + dy, x1: orig.x1 + dx, y1: orig.y1 + dy };
      }));
      return;
    }
    if (!drawingRef.current) return;
    const p = pos(e);
    if (!cur.current) return;
    if (tool === "pen") cur.current.points.push(p);
    else if (tool === "erase") {
      // 橡皮擦軌跡點距不必太密，省 Firestore 空間；圓頭線條視覺上仍是連續的
      const pts = cur.current.points, last = pts[pts.length - 1];
      if (Math.hypot(p.x - last.x, p.y - last.y) < eraserSize / 4) return;
      pts.push(p);
    }
    else { cur.current.x1 = p.x; cur.current.y1 = p.y; }
    redraw();
  };

  const end = () => {
    panStart.current = null;
    if (selDragRef.current) { selDragRef.current = null; return; }
    if (!drawingRef.current) return;
    drawingRef.current = false;
    const finished = cur.current;
    cur.current = null;
    if (finished) { setStrokes((s) => [...s, finished]); setRedoStack([]); setSelectedId(finished.id); }
  };

  const commitText = () => {
    if (textInput && textInput.value.trim()) {
      const st = { id: uid(), type: "text", color, text: textInput.value, x: textInput.x, y: textInput.y, size: fontSize };
      setStrokes((s) => [...s, st]);
      setRedoStack([]);
      setSelectedId(st.id);
    }
    setTextInput(null);
  };

  // 雙擊選取中的文字物件可以重新編輯內容
  const dblClick = (e) => {
    if (!selectedId) return;
    const sel = strokes.find((s) => s.id === selectedId);
    if (!sel || sel.type !== "text") return;
    if (hitTestSelected(pos(e), sel) !== "move") return;
    setStrokes((s) => s.filter((x) => x.id !== sel.id));
    setColor(sel.color); setFontSize(sel.size);
    setTextInput({ x: sel.x, y: sel.y, value: sel.text });
    setSelectedId(null);
    setTool("text");
  };

  // 選取中的物件（剛畫完/剛編輯完那個）也能直接改顏色、粗細、字級、填滿
  const updateSelected = (patch) => {
    if (!selectedId) return;
    setStrokes((arr) => arr.map((s) => (s.id === selectedId ? { ...s, ...patch } : s)));
  };

  const undo = () => {
    setStrokes((s) => {
      if (!s.length) return s;
      const last = s[s.length - 1];
      setRedoStack((r) => [...r, last]);
      return s.slice(0, -1);
    });
    setSelectedId(null);
  };
  const redo = () => {
    setRedoStack((r) => {
      if (!r.length) return r;
      const next = r[r.length - 1];
      setStrokes((s) => [...s, next]);
      return r.slice(0, -1);
    });
  };
  const deleteSelectedStroke = () => {
    if (!selectedId) return;
    setStrokes((s) => {
      const target = s.find((x) => x.id === selectedId);
      if (target) setRedoStack((r) => [...r, target]);
      return s.filter((x) => x.id !== selectedId);
    });
    setSelectedId(null);
  };
  const save = () => {
    cur.current = null;
    // 存檔前把選取框（虛線框、控制點）從畫布上清掉，重畫回「底圖＋筆跡層」，不然會被存進圖片裡
    const c = canvasRef.current;
    if (c && imgRef.current && layerRef.current) {
      const ctx = c.getContext("2d");
      ctx.clearRect(0, 0, c.width, c.height);
      const base = (grayscale && grayCanvasRef.current) ? grayCanvasRef.current : imgRef.current;
      ctx.drawImage(base, 0, 0, c.width, c.height);
      ctx.drawImage(layerRef.current, 0, 0);
    }
    onSave({ strokes, grayscale, dataUrl: canvasRef.current?.toDataURL('image/jpeg', JPG_QUALITY) });
  };

  const tools = [
    { id: "pen", icon: h(Icon, { name: 'edit', size: 15 }), label: "畫筆" },
    { id: "line", icon: "╱", label: "直線" },
    { id: "arrow", icon: "↗", label: "箭頭" },
    { id: "rect", icon: "▢", label: "方框" },
    { id: "ellipse", icon: "○", label: "橢圓" },
    { id: "highlight", icon: h(Icon, { name: 'highlighter', size: 15 }), label: "螢光標記" },
    { id: "text", icon: "T", label: "文字" },
    { id: "erase", icon: h(Icon, { name: 'eraser', size: 15 }), label: "橡皮擦" },
  ];

  const barSep = h('div', { style: { width: 1, height: 22, background: '#334155', margin: '0 2px', flexShrink: 0 } });

  return h('div', { style: { ...S.modalOverlay, padding: 0 } },
    h('div', { style: { ...S.annotatorBox, maxWidth: '100vw', maxHeight: '100vh', width: '100vw', height: '100vh', borderRadius: 0 } },
      h('div', { style: { background: "#0f172a", borderBottom: "1px solid #1e293b", padding: "8px 12px", display: "flex", flexWrap: "wrap", alignItems: "center", gap: 6, flexShrink: 0 } },
        // 工具組
        h('div', { style: { display: "flex", alignItems: "center", gap: 4 } },
          ...tools.map((t) =>
            h('button', { key: t.id, onClick: () => { setTool(t.id); setSelectedId(null); }, title: t.label,
              style: { ...S.toolBtn, ...(tool === t.id ? S.toolBtnActive : {}) } }, t.icon)),
          (tool === "rect" || tool === "ellipse") && h('button', {
            onClick: () => setFillShape(f => { const nv = !f; updateSelected({ fill: nv }); return nv; }),
            title: "填滿形狀", style: { ...S.toolBtn, ...(fillShape ? S.toolBtnActive : {}) } }, fillShape ? '■' : '□'),
        ),
        barSep,
        // 顏色與粗細
        h('div', { style: { display: "flex", alignItems: "center", gap: 6 } },
          ...COLORS.map((c) =>
            h('button', { key: c, onClick: () => { setColor(c); updateSelected({ color: c }); },
              style: { ...S.swatch, width: 20, height: 20, background: c, outline: color === c ? "2px solid #fff" : "1px solid #475569", outlineOffset: 2 } })),
          tool === "erase"
            ? h('input', { key: 'erase-size', type: "range", min: 8, max: 80, value: eraserSize, title: `橡皮擦大小 ${eraserSize}`,
                onChange: (e) => { const v = +e.target.value; setEraserSize(v); updateSelected({ width: v }); }, style: { width: 88, accentColor: '#14b8a6' } })
            : tool === "text"
            ? h('input', { key: 'font-size', type: "range", min: 14, max: 72, value: fontSize, title: `文字大小 ${fontSize}`,
                onChange: (e) => { const v = +e.target.value; setFontSize(v); updateSelected({ size: v }); }, style: { width: 88, accentColor: '#14b8a6' } })
            : h('input', { key: 'pen-size', type: "range", min: 2, max: 14, value: width, title: `筆寬 ${width}`,
                onChange: (e) => { const v = +e.target.value; setWidth(v); updateSelected({ width: v }); }, style: { width: 88, accentColor: '#14b8a6' } })
        ),
        barSep,
        // 復原 / 重做 / 刪除選中 / 灰階
        h('div', { style: { display: "flex", alignItems: "center", gap: 4 } },
          h('button', { onClick: undo, disabled: !strokes.length, title: "復原 (Ctrl+Z)", style: { ...S.toolBtn, opacity: strokes.length ? 1 : 0.35 } }, h(Icon, { name: 'undo', size: 15 })),
          h('button', { onClick: redo, disabled: !redoStack.length, title: "重做 (Ctrl+Shift+Z)", style: { ...S.toolBtn, opacity: redoStack.length ? 1 : 0.35 } }, h(Icon, { name: 'redo', size: 15 })),
          selectedId && h('button', { onClick: deleteSelectedStroke, title: "刪除選取物件 (Delete)", style: { ...S.toolBtn, color: '#f87171', borderColor: 'rgba(248,113,113,0.4)' } }, h(Icon, { name: 'trash', size: 15 })),
          h('button', { onClick: () => setGrayscale(g => !g), title: "黑白底圖",
            style: { ...S.toolBtn, ...(grayscale ? S.toolBtnActive : {}) } }, '◐')
        ),
        barSep,
        // 縮放 + 取消 / 完成
        h('div', { style: { display: "flex", alignItems: "center", gap: 5, marginLeft: 'auto' } },
          h('button', { onClick: () => setZoom(z => Math.max(0.25, +(z-0.25).toFixed(2))), title: '縮小', style: S.toolBtn }, '−'),
          h('span', { className: 'tabular', style: { color: '#94a3b8', fontSize: 12, minWidth: 40, textAlign: 'center', userSelect: 'none' } }, `${Math.round(zoom*100)}%`),
          h('button', { onClick: () => setZoom(z => Math.min(4, +(z+0.25).toFixed(2))), title: '放大', style: S.toolBtn }, '+'),
          h('button', { onClick: onClose, style: { ...S.ghostBtn, background: '#1e293b', color: '#cbd5e1', borderColor: '#334155', marginLeft: 4 } }, '取消'),
          h('button', { className: 'btn-primary', onClick: save, style: S.primaryBtn }, h(Icon, { name: 'check', size: 14 }), '完成')
        )
      ),
      h('div', { ref: canvasWrapRef, style: { ...S.canvasWrap, justifyContent: 'flex-start' } },
        h('div', { ref: innerRef, style: { position: "relative", flexShrink: 0, margin: "0 auto", width: `${Math.round(zoom * 100)}%` } },
          h('canvas', {
            ref: canvasRef, width: imgDims.w, height: imgDims.h,
            style: { width: "100%", display: "block", borderRadius: 8, touchAction: "none",
              cursor: tool === "text" ? "text" : (tool === "pen" || tool === "erase") ? "none" : "crosshair" },
            onMouseDown: start, onMouseMove: move, onMouseUp: end, onMouseLeave: () => { end(); hideCursor(); },
            onTouchStart: start, onTouchMove: move, onTouchEnd: () => { end(); hideCursor(); },
            onDoubleClick: dblClick
          }),
          h('div', { ref: cursorRef, style: {
            position: "absolute", display: "none", pointerEvents: "none", boxSizing: "border-box",
            borderRadius: "50%", transform: "translate(-50%, -50%)",
            border: "1px solid #000", boxShadow: "0 0 0 1px rgba(255,255,255,.95)",
            background: tool === "erase" ? "rgba(255,255,255,.3)" : color + "66"
          } }),
          textInput && h('textarea', {
            autoFocus: true, value: textInput.value, rows: 1,
            onChange: (e) => {
              e.target.style.height = "auto";
              e.target.style.height = e.target.scrollHeight + "px";
              setTextInput({ ...textInput, value: e.target.value });
            },
            onBlur: commitText,
            onKeyDown: (e) => {
              if (e.nativeEvent.isComposing) return; // 中文注音/拼音選字時的 Enter 不要誤判成送出
              if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); commitText(); }
              else if (e.key === "Escape") { e.preventDefault(); setTextInput(null); }
            },
            placeholder: "輸入文字，Enter 完成、Shift+Enter 換行、Esc 取消",
            style: {
              position: "absolute",
              left: `${(textInput.x / imgDims.w) * 100}%`,
              top: `${(textInput.y / imgDims.h) * 100}%`,
              color, fontSize: fontSize * dispScale, lineHeight: 1.3,
              fontFamily: '-apple-system, "PingFang TC", sans-serif',
              border: "none", borderRadius: 2, padding: 0, margin: 0,
              background: "transparent", outline: "1px dashed rgba(14,165,233,.7)", outlineOffset: 4,
              minWidth: 60, resize: "none", overflow: "hidden",
            }
          })
        )
      )
    )
  );
}

function PhotoCropper({ src, onSave, onClose }) {
  const containerRef = useRef(null);
  const imgElRef = useRef(null);
  const [natural, setNatural] = useState({ w: 0, h: 0 });
  const [rect, setRect] = useState({ x: 0.05, y: 0.05, w: 0.9, h: 0.9 });
  const dragRef = useRef(null);

  const clamp01 = (v) => Math.max(0, Math.min(1, v));

  const onDrag = useCallback((e) => {
    const drag = dragRef.current;
    const container = containerRef.current;
    if (!drag || !container) return;
    e.preventDefault();
    const t = e.touches ? e.touches[0] : e;
    const cRect = container.getBoundingClientRect();
    const dx = (t.clientX - drag.startX) / cRect.width;
    const dy = (t.clientY - drag.startY) / cRect.height;
    const s = drag.startRect;
    const min = 0.05;
    let { x, y, w, h } = s;
    if (drag.mode === 'move') {
      x = clamp01(s.x + dx); y = clamp01(s.y + dy);
      x = Math.min(x, 1 - s.w); y = Math.min(y, 1 - s.h);
    } else {
      if (drag.mode.includes('e')) w = clamp01(s.x + s.w + dx) - s.x;
      if (drag.mode.includes('s')) h = clamp01(s.y + s.h + dy) - s.y;
      if (drag.mode.includes('w')) { const nx = clamp01(s.x + dx); w = s.x + s.w - nx; x = nx; }
      if (drag.mode.includes('n')) { const ny = clamp01(s.y + dy); h = s.y + s.h - ny; y = ny; }
      if (w < min) { if (drag.mode.includes('w')) x = s.x + s.w - min; w = min; }
      if (h < min) { if (drag.mode.includes('n')) y = s.y + s.h - min; h = min; }
    }
    setRect({ x, y, w, h });
  }, []);

  const endDrag = useCallback(() => {
    dragRef.current = null;
    window.removeEventListener('mousemove', onDrag);
    window.removeEventListener('mouseup', endDrag);
    window.removeEventListener('touchmove', onDrag);
    window.removeEventListener('touchend', endDrag);
  }, [onDrag]);

  useEffect(() => () => endDrag(), [endDrag]);

  const beginDrag = (mode) => (e) => {
    e.preventDefault(); e.stopPropagation();
    const t = e.touches ? e.touches[0] : e;
    dragRef.current = { mode, startX: t.clientX, startY: t.clientY, startRect: { ...rect } };
    window.addEventListener('mousemove', onDrag);
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchmove', onDrag, { passive: false });
    window.addEventListener('touchend', endDrag);
  };

  const apply = () => {
    if (!natural.w || !natural.h || !imgElRef.current) return;
    const sx = Math.round(rect.x * natural.w);
    const sy = Math.round(rect.y * natural.h);
    const sw = Math.max(1, Math.round(rect.w * natural.w));
    const sh = Math.max(1, Math.round(rect.h * natural.h));
    const canvas = document.createElement('canvas');
    canvas.width = sw; canvas.height = sh;
    canvas.getContext('2d').drawImage(imgElRef.current, sx, sy, sw, sh, 0, 0, sw, sh);
    onSave(canvas.toDataURL('image/jpeg', JPG_QUALITY));
  };

  const handleStyle = (pos) => {
    const base = { position: 'absolute', width: 14, height: 14, background: '#fff', border: '2px solid #0d9488', borderRadius: 3, touchAction: 'none', zIndex: 2 };
    const map = {
      nw: { left: -7, top: -7, cursor: 'nwse-resize' },
      n:  { left: '50%', top: -7, marginLeft: -7, cursor: 'ns-resize' },
      ne: { right: -7, top: -7, cursor: 'nesw-resize' },
      e:  { right: -7, top: '50%', marginTop: -7, cursor: 'ew-resize' },
      se: { right: -7, bottom: -7, cursor: 'nwse-resize' },
      s:  { left: '50%', bottom: -7, marginLeft: -7, cursor: 'ns-resize' },
      sw: { left: -7, bottom: -7, cursor: 'nesw-resize' },
      w:  { left: -7, top: '50%', marginTop: -7, cursor: 'ew-resize' },
    };
    return { ...base, ...map[pos] };
  };

  return h('div', { style: { ...S.modalOverlay, padding: 0 } },
    h('div', { style: { ...S.annotatorBox, maxWidth: '100vw', maxHeight: '100vh', width: '100vw', height: '100vh', borderRadius: 0 } },
      h('div', { style: { background: "#0f172a", padding: "10px 14px", display: "flex", alignItems: 'center', gap: 10, flexShrink: 0 } },
        h('span', { style: { color: '#e2e8f0', fontSize: 14, fontWeight: 600 } }, '✂ 裁切圖片'),
        h('button', { onClick: () => setRect({ x: 0.05, y: 0.05, w: 0.9, h: 0.9 }), style: S.toolBtn, title: '重設範圍' }, '⟲'),
        h('div', { style: { flex: 1 } }),
        h('button', { onClick: onClose, style: S.ghostBtn }, '取消'),
        h('button', { onClick: apply, style: S.primaryBtn }, '✓ 完成裁切')
      ),
      h('div', { style: { ...S.canvasWrap, flex: 1, alignItems: 'center' } },
        h('div', { ref: containerRef, style: { position: 'relative', display: 'inline-block', maxWidth: '100%', maxHeight: '100%', overflow: 'hidden', lineHeight: 0 } },
          h('img', { ref: imgElRef, src, draggable: false, crossOrigin: 'anonymous', // 裁切要用 toDataURL 讀出結果，讀 Storage 網址時一定要設
            onLoad: (e) => setNatural({ w: e.target.naturalWidth, h: e.target.naturalHeight }),
            style: { maxWidth: '100%', maxHeight: '80vh', display: 'block', userSelect: 'none' } }),
          natural.w > 0 && h('div', {
            onMouseDown: beginDrag('move'), onTouchStart: beginDrag('move'),
            style: { position: 'absolute', left: `${rect.x*100}%`, top: `${rect.y*100}%`, width: `${rect.w*100}%`, height: `${rect.h*100}%`,
              border: '2px solid #fff', boxShadow: '0 0 0 2000px rgba(0,0,0,.55)', cursor: 'move', boxSizing: 'border-box' } },
            ...['nw','n','ne','e','se','s','sw','w'].map(pos => h('div', { key: pos, onMouseDown: beginDrag(pos), onTouchStart: beginDrag(pos), style: handleStyle(pos) }))
          )
        )
      )
    )
  );
}

function Lightbox({ image, onClose }) {
  const isGallery = Array.isArray(image?.list) && image.list.length > 0;
  const list = isGallery ? image.list : [image];
  const [curIdx, setCurIdx] = useState(isGallery ? (image.index || 0) : 0);
  const currentImg = list[curIdx] || list[0];
  const onAnnotateIndex = image?.onAnnotateIndex;

  const canvasRef = useRef(null);
  const containerRef = useRef(null);
  const [zoom, setZoom] = useState(1);
  const [baseDims, setBaseDims] = useState({ w: 0, h: 0 });
  const pinchDist = useRef(null);
  const swipeStart = useRef(null);

  useEffect(() => {
    setCurIdx(isGallery ? (image.index || 0) : 0);
  }, [image]);

  useEffect(() => { setZoom(1); }, [curIdx]);

  const goPrev = useCallback(() => { if (list.length > 1) setCurIdx(i => (i - 1 + list.length) % list.length); }, [list.length]);
  const goNext = useCallback(() => { if (list.length > 1) setCurIdx(i => (i + 1) % list.length); }, [list.length]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape') onClose();
      else if (e.key === 'ArrowLeft') goPrev();
      else if (e.key === 'ArrowRight') goNext();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose, goPrev, goNext]);

  useEffect(() => {
    if (!currentImg) return;
    const img = document.createElement('img');
    img.onload = () => {
      const c = canvasRef.current; if (!c) return;
      const maxW = window.innerWidth * 0.90;
      const maxH = window.innerHeight * 0.78;
      const scale = Math.min(1, maxW / img.width, maxH / img.height);
      const cssW = Math.round(img.width * scale);
      const cssH = Math.round(img.height * scale);
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      c.width = cssW * dpr;
      c.height = cssH * dpr;
      setBaseDims({ w: cssW, h: cssH });
      const ctx = c.getContext('2d');
      ctx.scale(dpr, dpr);
      if (currentImg.grayscale) ctx.filter = 'grayscale(100%)';
      ctx.drawImage(img, 0, 0, cssW, cssH);
      ctx.filter = 'none';
      const annotatorScale = Math.min(1, 1400 / img.width);
      const ratio = cssW / (img.width * annotatorScale);
      for (const s of (currentImg.strokes || [])) {
        if (!s || !s.color) continue;
        ctx.strokeStyle = s.color; ctx.fillStyle = s.color;
        ctx.lineWidth = s.width * ratio; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        if (s.type === 'pen') {
          ctx.beginPath();
          s.points.forEach((p, i) => (i ? ctx.lineTo(p.x * ratio, p.y * ratio) : ctx.moveTo(p.x * ratio, p.y * ratio)));
          ctx.stroke();
        } else if (s.type === 'rect') {
          ctx.strokeRect(s.x0 * ratio, s.y0 * ratio, (s.x1 - s.x0) * ratio, (s.y1 - s.y0) * ratio);
        } else if (s.type === 'arrow') {
          const x0 = s.x0 * ratio, y0 = s.y0 * ratio, x1 = s.x1 * ratio, y1 = s.y1 * ratio;
          const head = (10 + s.width * 2) * ratio;
          const ang = Math.atan2(y1 - y0, x1 - x0);
          ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x1, y1);
          ctx.lineTo(x1 - head * Math.cos(ang - Math.PI / 6), y1 - head * Math.sin(ang - Math.PI / 6));
          ctx.lineTo(x1 - head * Math.cos(ang + Math.PI / 6), y1 - head * Math.sin(ang + Math.PI / 6));
          ctx.closePath(); ctx.fill();
        } else if (s.type === 'ellipse') {
          const rx = Math.abs(s.x1 - s.x0) / 2 * ratio, ry = Math.abs(s.y1 - s.y0) / 2 * ratio;
          if (rx > 0.5 && ry > 0.5) { ctx.beginPath(); ctx.ellipse((s.x0+s.x1)/2*ratio, (s.y0+s.y1)/2*ratio, rx, ry, 0, 0, Math.PI*2); ctx.stroke(); }
        } else if (s.type === 'line') {
          ctx.beginPath(); ctx.moveTo(s.x0*ratio, s.y0*ratio); ctx.lineTo(s.x1*ratio, s.y1*ratio); ctx.stroke();
        } else if (s.type === 'highlight') {
          ctx.save(); ctx.globalAlpha = 0.38; ctx.fillStyle = s.color;
          ctx.fillRect(Math.min(s.x0,s.x1)*ratio, Math.min(s.y0,s.y1)*ratio, Math.abs(s.x1-s.x0)*ratio, Math.abs(s.y1-s.y0)*ratio);
          ctx.restore();
        } else if (s.type === 'text') {
          ctx.font = `${s.size * ratio}px -apple-system, "PingFang TC", sans-serif`;
          ctx.textBaseline = 'top';
          ctx.fillText(s.text, s.x * ratio, s.y * ratio);
        }
      }
    };
    img.src = currentImg.url || currentImg.dataUrl;
  }, [currentImg]);

  useEffect(() => {
    const el = containerRef.current;
    if (!el) return;
    const onWheel = (e) => {
      e.preventDefault();
      setZoom(z => Math.max(0.3, Math.min(6, z + (e.deltaY < 0 ? 0.15 : -0.15))));
    };
    const onTouchMove = (e) => {
      if (e.touches.length === 2 && pinchDist.current !== null) {

        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        setZoom(z => Math.max(0.3, Math.min(6, z * (dist / pinchDist.current))));
        pinchDist.current = dist;
      }
    };
    el.addEventListener('wheel', onWheel, { passive: false });
    el.addEventListener('touchmove', onTouchMove, { passive: false });
    return () => { el.removeEventListener('wheel', onWheel); el.removeEventListener('touchmove', onTouchMove); };
  }, []);

  const downloadCur = async () => {
    try {
      const resp = await fetch(currentImg.url || currentImg.dataUrl);
      const blob = await resp.blob();
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objUrl; a.download = `photo-${curIdx + 1}.jpg`;

    style: { ...S.modalOverlay, background: 'rgba(2, 6, 23, 0.88)', cursor: 'default', alignItems: 'flex-start', paddingTop: 18 },
    onClick: (e) => e.target === e.currentTarget && onClose()
  },
    list.length > 1 && h('button', {
      onClick: (e) => { e.stopPropagation(); goPrev(); },
      title: '上一張 (←)',
      style: { position: 'fixed', left: 16, top: '50%', transform: 'translateY(-50%)', zIndex: 120, width: 42, height: 42, borderRadius: '50%', background: 'rgba(255,255,255,.16)', color: '#fff', border: '1px solid rgba(255,255,255,.2)', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }
    }, h(Icon, { name: 'chevronLeft', size: 22 })),
    list.length > 1 && h('button', {
      onClick: (e) => { e.stopPropagation(); goNext(); },
      title: '下一張 (→)',
      style: { position: 'fixed', right: 16, top: '50%', transform: 'translateY(-50%)', zIndex: 120, width: 42, height: 42, borderRadius: '50%', background: 'rgba(255,255,255,.16)', color: '#fff', border: '1px solid rgba(255,255,255,.2)', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }
    }, h(Icon, { name: 'chevronRight', size: 22 })),
    h('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', width: '100%', maxWidth: '98vw', margin: '0 auto' } },
      h('div', { style: { display: 'flex', gap: 6, marginBottom: 12, alignItems: 'center', flexWrap: 'wrap', justifyContent: 'center' } },
        list.length > 1 && h('span', { className: 'tabular', style: { color: '#e2e8f0', fontSize: 12.5, fontWeight: 600, background: 'rgba(255,255,255,.12)', padding: '6px 10px', borderRadius: 8 } }, `${curIdx + 1} / ${list.length}`),
        h('button', { onClick: () => changeZoom(-0.25), style: btnStyle }, '−'),
        h('span', { className: 'tabular', style: { color: '#fff', fontSize: 12.5, minWidth: 44, textAlign: 'center', userSelect: 'none' } }, `${Math.round(zoom * 100)}%`),
        h('button', { onClick: () => changeZoom(0.25), style: btnStyle }, '+'),
        h('button', { onClick: () => setZoom(1), style: { ...btnStyle, fontSize: 12, opacity: 0.85 } }, '重置'),
        onAnnotateIndex && h('button', { onClick: () => onAnnotateIndex(curIdx), style: { ...btnStyle, background: 'rgba(20,184,166,.32)', borderColor: 'rgba(45,212,191,.4)' } }, h(Icon, { name: 'brush', size: 14 }), '標註'),
        h('button', { onClick: downloadCur, style: btnStyle, title: '下載圖片' }, h(Icon, { name: 'download', size: 14 }), '下載'),
        h('button', { onClick: onClose, style: btnStyle }, h(Icon, { name: 'x', size: 14 }), '關閉')
      ),
      h('div', {
        ref: containerRef,
        style: { overflow: 'auto', maxWidth: '94vw', maxHeight: '78vh', borderRadius: 10 },
        onTouchStart: (e) => {
          if (e.touches.length === 2) {
            pinchDist.current = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            swipeStart.current = null;
          } else if (e.touches.length === 1) {
            swipeStart.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          } else {
            swipeStart.current = null;
          }
        },
        onTouchEnd: (e) => {
          pinchDist.current = null;
          if (swipeStart.current && zoom <= 1.05) {
            const t = e.changedTouches && e.changedTouches[0];
            if (t) {
              const dx = t.clientX - swipeStart.current.x;
              const dy = t.clientY - swipeStart.current.y;
              if (dy > 80 && dy > Math.abs(dx) * 1.5) onClose();
              else if (list.length > 1 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                if (dx > 0) goPrev(); else goNext();
              }
            }
          }
          swipeStart.current = null;
        },
      },
        h('canvas', { ref: canvasRef, style: {
          display: 'block', borderRadius: 10,

    )
  );
}

  const canvasRef = useRef(null);
  useEffect(() => {
    const img = document.createElement('img');
    img.onload = () => {
      const c = canvasRef.current; if (!c) return;
      const maxW = 400; const scale = Math.min(1, maxW / img.width);
      const cssW = img.width * scale, cssH = img.height * scale;
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      c.width = cssW * dpr; c.height = cssH * dpr;
      const ctx = c.getContext('2d');
      ctx.scale(dpr, dpr);
      if (image.grayscale) ctx.filter = 'grayscale(100%)';
      ctx.drawImage(img, 0, 0, cssW, cssH);
      ctx.filter = 'none';
      const annotatorScale = Math.min(1, 1400 / img.width);
      const ratio = cssW / (img.width * annotatorScale);
      for (const s of (image.strokes || [])) {
        if (!s || !s.color) continue;
        ctx.strokeStyle = s.color; ctx.fillStyle = s.color;
        ctx.lineWidth = s.width * ratio; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        if (s.type === 'pen') {
          ctx.beginPath();
          s.points.forEach((p, i) => (i ? ctx.lineTo(p.x * ratio, p.y * ratio) : ctx.moveTo(p.x * ratio, p.y * ratio)));
          ctx.stroke();
        } else if (s.type === 'rect') {
          ctx.strokeRect(s.x0 * ratio, s.y0 * ratio, (s.x1 - s.x0) * ratio, (s.y1 - s.y0) * ratio);
        } else if (s.type === 'arrow') {
          const x0 = s.x0 * ratio, y0 = s.y0 * ratio, x1 = s.x1 * ratio, y1 = s.y1 * ratio;
          const head = (10 + s.width * 2) * ratio;
          const ang = Math.atan2(y1 - y0, x1 - x0);
          ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x1, y1);
          ctx.lineTo(x1 - head * Math.cos(ang - Math.PI / 6), y1 - head * Math.sin(ang - Math.PI / 6));
          ctx.lineTo(x1 - head * Math.cos(ang + Math.PI / 6), y1 - head * Math.sin(ang + Math.PI / 6));
          ctx.closePath(); ctx.fill();
        } else if (s.type === 'ellipse') {
          const rx = Math.abs(s.x1 - s.x0) / 2 * ratio, ry = Math.abs(s.y1 - s.y0) / 2 * ratio;
          if (rx > 0.5 && ry > 0.5) { ctx.beginPath(); ctx.ellipse((s.x0+s.x1)/2*ratio, (s.y0+s.y1)/2*ratio, rx, ry, 0, 0, Math.PI*2); ctx.stroke(); }
        } else if (s.type === 'line') {
          ctx.beginPath(); ctx.moveTo(s.x0*ratio, s.y0*ratio); ctx.lineTo(s.x1*ratio, s.y1*ratio); ctx.stroke();
        } else if (s.type === 'highlight') {
          ctx.save(); ctx.globalAlpha = 0.38; ctx.fillStyle = s.color;
          ctx.fillRect(Math.min(s.x0,s.x1)*ratio, Math.min(s.y0,s.y1)*ratio, Math.abs(s.x1-s.x0)*ratio, Math.abs(s.y1-s.y0)*ratio);
          ctx.restore();
        } else if (s.type === 'text') {
          ctx.font = `${s.size * ratio}px -apple-system, "PingFang TC", sans-serif`;
          ctx.textBaseline = 'top';
          ctx.fillText(s.text, s.x * ratio, s.y * ratio);
        }
      }
    };
    img.src = image.url || image.dataUrl;
  }, [image.url, image.dataUrl, image.strokes, image.grayscale]);

  // Storage 網址是跨網域連結，瀏覽器的 download 屬性對跨網域連結不生效（會直接開新分頁看圖，不會下載）；
  // data: URI（舊資料）本來就同源，download 屬性有效，但這裡統一用 fetch 轉 blob 下載，兩種來源都能正常存檔。

    try {
      const resp = await fetch(image.url || image.dataUrl);

      const a = document.createElement('a');

}

  const selBreakRef        = useRef(null);
