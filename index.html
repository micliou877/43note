  const [copyFeedback, setCopyFeedback] = useState(false);
  const [noteImages, setNoteImages] = useState([]);
  const [latestNoteTime, setLatestNoteTime] = useState(null);
  const [globalSearchOpen, setGlobalSearchOpen] = useState(false);
  const [globalSearchQuery, setGlobalSearchQuery] = useState('');
  const [globalSearchFilter, setGlobalSearchFilter] = useState('all'); // 'all' | 'note' | 'task'
  const [globalSearchIdx, setGlobalSearchIdx] = useState(0);
  const [searchWinPos, setSearchWinPos] = useState(null); // 浮動搜尋視窗位置；null = 預設右上角
  const [allNotesForSearch, setAllNotesForSearch] = useState([]);
  const [allTasksForSearch, setAllTasksForSearch] = useState([]);
  const [searchJumpRequest, setSearchJumpRequest] = useState(null); // 從搜尋結果點筆記時，記錄要跳去哪個筆記、高亮哪個關鍵字
  const [noteTagPicker, setNoteTagPicker] = useState(false); // 插入「標記筆記」時的選擇視窗開關
  const [noteTagQuery, setNoteTagQuery] = useState('');
  const [noteNavStack, setNoteNavStack] = useState([]); // 點筆記標記連結過去時，記錄從哪裡來，才能「返回」
  const [showAllTasks, setShowAllTasks] = useState(true);
  const [allTasksFull, setAllTasksFull] = useState([]);

  const [allTasksSearch, setAllTasksSearch] = useState('');
  const [overdueModal, setOverdueModal] = useState(null);
  const [collapsedAllTaskProjects, setCollapsedAllTaskProjects] = useState(new Set());
  const [allTasksViewMode, setAllTasksViewMode] = useState('calendar');
  const [allTasksCalSelectedDate, setAllTasksCalSelectedDate] = useState(null);
  const [calOverviewNewTask, setCalOverviewNewTask] = useState(null);
  const [isDesktop, setIsDesktop] = useState(() => window.innerWidth > 768);

  useEffect(() => {
    const onResize = () => setIsDesktop(window.innerWidth > 768);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  useEffect(() => { setGlobalSearchIdx(0); }, [globalSearchQuery, globalSearchFilter, globalSearchOpen]);

  useEffect(() => {
    const goOnline = () => setIsOffline(false);
    const goOffline = () => setIsOffline(true);
    window.addEventListener('online', goOnline);
    window.addEventListener('offline', goOffline);
    return () => { window.removeEventListener('online', goOnline); window.removeEventListener('offline', goOffline); };
  }, []);

  useEffect(() => {
    const disarm = () => { dragArmed.current = false; };
    window.addEventListener('mouseup', disarm);
    window.addEventListener('dragend', disarm);
    return () => { window.removeEventListener('mouseup', disarm); window.removeEventListener('dragend', disarm); };
  }, []);

  useEffect(() => { activeNoteRef.current = activeNote; }, [activeNote]);
  useEffect(() => { if (!activeNote) setFocusMode(false); }, [activeNote]);
  useEffect(() => { if (!activeNote) setReadMode(false); }, [activeNote]);
  // 整個網站預設用 viewport 鎖死縮放（避免編輯筆記時手滑誤觸放大），
  // 純閱讀模式時放開限制，讓手機可以兩指縮放看清楚內容；離開閱讀模式再鎖回去。
  useEffect(() => {
    const meta = document.querySelector('meta[name="viewport"]');
    if (!meta) return;
    meta.setAttribute('content', readMode
      ? 'width=device-width, initial-scale=1.0'
      : 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
  }, [readMode]);
  useEffect(() => {
    bodyUndoStack.current = [];
    bodyUndoLastPush.current = 0;
    setCanBodyUndo(false);
    selBreakRef.current = null;
    if (bodyRef.current) {
      bodyRef.current.innerHTML = toBodyHtml(activeNote?.body || '');
      // 舊筆記的自由擺放圖片（.img-free）可能還是用 px 記錄 left/top/width。
      // 列印時側欄會隱藏、note-body 寬度跟編輯時不同、文字也會重新換行，
      // px 位置在列印版面會整個跑掉，所以載入時偵測到就轉成相對百分比並存回去。
      const body = bodyRef.current;
      const bw = body.clientWidth || 1, bh = body.offsetHeight || 1;
      let migrated = false;
      body.querySelectorAll('img[data-inline].img-free').forEach(img => {
        if (img.style.left && img.style.left.endsWith('px')) { img.style.left = (parseFloat(img.style.left) / bw * 100) + '%'; migrated = true; }
        if (img.style.top && img.style.top.endsWith('px')) { img.style.top = (parseFloat(img.style.top) / bh * 100) + '%'; migrated = true; }
        if (img.style.width && img.style.width.endsWith('px')) { img.style.width = (parseFloat(img.style.width) / bw * 100) + '%'; migrated = true; }
      });
      if (migrated) updateNoteFields({ body: body.innerHTML });
    }
  }, [activeNote?.id]);

  // 從搜尋結果點筆記：跳到關鍵字出現的位置並用紅色暫時高亮，像瀏覽器 Ctrl+F
  useEffect(() => {
    if (!searchJumpRequest) return;
    const body = bodyRef.current;
    if (!body || searchJumpRequest.noteId !== activeNote?.id) return;
    setSearchJumpRequest(null);
    body.querySelectorAll('mark.search-jump-highlight').forEach(m => {
      const parent = m.parentNode; if (!parent) return;
      while (m.firstChild) parent.insertBefore(m.firstChild, m);
      parent.removeChild(m);
      parent.normalize();
    });
    const q = searchJumpRequest.query;
    if (!q) return;
    const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
    let target = null, idx = -1, node;
    while ((node = walker.nextNode())) {
      const i = ciIndexOf(node.nodeValue, q);
      if (i >= 0) { target = node; idx = i; break; }
    }
    if (!target) return;
    const range = document.createRange();
    range.setStart(target, idx);
    range.setEnd(target, idx + q.length);
    const mark = document.createElement('mark');
    mark.className = 'search-jump-highlight';
    mark.style.background = '#ef4444';
    mark.style.color = '#fff';
    mark.style.borderRadius = '3px';
    mark.style.padding = '0 1px';
    try { range.surroundContents(mark); } catch (e) { return; }
    mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const timer = setTimeout(() => {
      const parent = mark.parentNode; if (!parent) return;
      while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
      parent.removeChild(mark);
      parent.normalize();
    }, 2500);
    return () => clearTimeout(timer);
  }, [searchJumpRequest, activeNote?.id]);

  // 訂閱目前筆記的圖片 subcollection
  useEffect(() => {
    if (!user || !activeNote?.id) { setNoteImages([]); return; }
    const q = query(collection(db, `users/${user.uid}/notes/${activeNote.id}/images`), orderBy('sortOrder', 'asc'));

  }, [user, activeNote?.id]);

  // 自動遷移舊格式（images 陣列 → subcollection）
  useEffect(() => {
    if (!user || !activeNote?.id || !activeNote.images?.length) return;
    const migrate = async () => {
      const batch = writeBatch(db);
      activeNote.images.forEach((im, i) => {
        const ref = doc(collection(db, `users/${user.uid}/notes/${activeNote.id}/images`));
        batch.set(ref, { dataUrl: im.dataUrl, strokes: im.strokes || [], grayscale: im.grayscale || false, sortOrder: i, created: serverTimestamp() });
      });
      batch.update(doc(db, `users/${user.uid}/notes/${activeNote.id}`), { images: deleteField(), imageCount: activeNote.images.length });
      await batch.commit();
      updateNoteFields({ images: undefined, imageCount: activeNote.images.length });
    };
    migrate().catch(err => console.error('遷移圖片失敗', err));
  }, [activeNote?.id]);

  useEffect(() => {
    const onBeforeUnload = (e) => {
      if (isDirty.current) { e.preventDefault(); e.returnValue = ''; }
    };
    window.addEventListener('beforeunload', onBeforeUnload);
    return () => window.removeEventListener('beforeunload', onBeforeUnload);
  }, []);

  const getSafeTime = (val) => {
    if (!val) return 0;
    if (typeof val.toMillis === 'function') return val.toMillis();
    if (typeof val === 'number') return val;
    if (val.seconds) return val.seconds * 1000;
    return new Date(val).getTime() || 0;
  };

  useEffect(() => {
    getRedirectResult(auth).catch(e => console.error("登入回傳:", e));
    const unsub = onAuthStateChanged(auth, (u) => { setUser(u); setAuthReady(true); });
    return unsub;
  }, []);

  useEffect(() => {
    if (!user) { setProjects([]); return; }
    const q = query(collection(db, `users/${user.uid}/projects`), orderBy("created", "desc"));
    return onSnapshot(q, (snap) => setProjects(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
  }, [user]);

  useEffect(() => {
    if (!user || !activeProject) { setNotes([]); setDbError(""); return; }
    const q = query(collection(db, `users/${user.uid}/notes`), where("projectId", "==", activeProject.id));
    return onSnapshot(q, (snap) => {
      setDbError(""); 
      const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      try { list.sort((a, b) => getSafeTime(b.updated) - getSafeTime(a.updated)); } catch (err) {}
      setNotes(list);
      const curActive = activeNoteRef.current;
      if (curActive && Date.now() - lastLocalEdit.current > 1500) {
        const fresh = list.find(n => n.id === curActive.id);
        if (fresh) setActiveNote(fresh);
      }
    }, (err) => {
      setDbError("筆記讀取被阻擋：" + err.message);
    });
  }, [user, activeProject]);

  useEffect(() => {
    if (!user || !activeProject) { setCrossTaggedNotes([]); return; }
    const q = query(collection(db, `users/${user.uid}/notes`), where('tags', 'array-contains', activeProject.id));
    return onSnapshot(q, (snap) => {
      setCrossTaggedNotes(snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(n => !n.deleted));
    });
  }, [user, activeProject]);

  useEffect(() => {
    if (!user) { setProjectFolders([]); return; }
    return onSnapshot(query(collection(db, `users/${user.uid}/projectFolders`), orderBy('created', 'asc')),
      snap => setProjectFolders(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
  }, [user]);

  useEffect(() => {

  const rotateInlineImg = async (imgId, deg) => {
    const img = bodyRef.current?.querySelector(`img[data-inline="${imgId}"]`);
    if (!img) return;
    try {
      const rotatedDataUrl = await rotateImageData(img.src, deg);
      const { url, path } = await uploadInlineEdit(activeNote.id, rotatedDataUrl);
      if (img.dataset.original) {
        const rotatedOriginal = await rotateImageData(img.dataset.original, deg);
        const up = await uploadInlineEdit(activeNote.id, rotatedOriginal);
        img.dataset.original = up.url;
      }
      img.src = url;
      img.dataset.path = path;
      img.dataset.strokes = '[]';
      updateNoteFields({ body: bodyRef.current.innerHTML });
      setSelImg(s => (s && s.imgId === imgId) ? { ...s, src: url, rect: img.getBoundingClientRect() } : s);
    } catch (err) { alert('旋轉失敗：' + err.message); }
  };
  // 剪下：從目前位置移除，記在 imgClipboard 裡（不刪 Storage 檔案，因為等一下貼上還要用）。
  // 貼到同一篇筆記就直接重用原本的網址；貼到別篇筆記才真的搬檔案過去（見 pasteInlineImg）。
  const cutInlineImg = (imgId) => {
    const img = bodyRef.current?.querySelector(`img[data-inline="${imgId}"]`);
    if (!img || !activeNote?.id) return;
    setImgClipboard({
      mode: 'cut', fromNoteId: activeNote.id,
      src: img.src, path: img.dataset.path || '', strokes: img.dataset.strokes || '', original: img.dataset.original || '',

  // （這樣才知道要複製到哪篇筆記底下，路徑才歸類得對），可以貼很多次。
  const copyInlineImg = (imgId) => {
    const img = bodyRef.current?.querySelector(`img[data-inline="${imgId}"]`);
    if (!img) return;
    setImgClipboard({ mode: 'copy', src: img.src, strokes: img.dataset.strokes || '', original: img.dataset.original || '' });
    clearSelImg();

  const pasteInlineImg = async () => {
    const body = bodyRef.current;
    if (!imgClipboard || !activeNote?.id || !body) return;
    const sel = window.getSelection();
    let range = (sel && sel.rangeCount > 0 && body.contains(sel.getRangeAt(0).startContainer)) ? sel.getRangeAt(0).cloneRange() : null;
    if (!range) { range = document.createRange(); range.selectNodeContents(body); range.collapse(false); }

    setUploading(true);
    try {
      let url = imgClipboard.src, path = imgClipboard.path || '';
      // 複製的圖片、或剪下後貼到「別篇」筆記：都要真的複製一份檔案到目前這篇筆記底下，
      // 不能共用同一個 Storage 檔案──不然以後任一邊刪除圖片，會把另一邊也弄壞。
      // 剪下後貼回「同一篇」筆記，直接重用原本的網址就好，不用多傳一次。
      const needsCopy = imgClipboard.mode === 'copy' || imgClipboard.fromNoteId !== activeNote.id;
      if (needsCopy) {
        const blob = await (await fetch(imgClipboard.src)).blob();
        const newPath = `users/${user.uid}/notes/${activeNote.id}/inline/${uid()}.jpg`;

        if (imgClipboard.mode === 'cut' && imgClipboard.path) deleteImagePathQuiet(imgClipboard.path); // 真的搬家了，舊檔案可以刪
        path = newPath;

      const img = document.createElement('img');
      img.dataset.inline = uid();
      if (path) img.dataset.path = path;
      if (imgClipboard.original) img.dataset.original = imgClipboard.original;
      if (imgClipboard.strokes) img.dataset.strokes = imgClipboard.strokes;
      img.src = url;
      body.focus();
      range.deleteContents();
      range.insertNode(img);
      range.setStartAfter(img);
      range.setEndAfter(img);
      sel.removeAllRanges();
      sel.addRange(range);
      updateNoteFields({ body: body.innerHTML });
      if (imgClipboard.mode === 'cut') setImgClipboard(null); // 剪下是搬移，貼過一次就沒了
    } catch (err) {

  // 自由擺放模式的圖片（.img-free）用滑鼠拖曳直接改 left/top，不影響文字排列。
  // left/top/width 一律存成「相對於 note-body 容器」的百分比而非固定 px──
  // 因為列印時側欄會被隱藏、note-body 的實際寬度跟編輯時不同，文字也會重新換行，
  // 用 px 記錄的位置在列印版面裡會整個跑掉；用百分比才能讓圖片跟著容器縮放，位置維持相對一致。
  const startFreeImgDrag = (e) => {
    const img = e.target.tagName === 'IMG' && e.target.dataset.inline ? e.target : null;
    if (!img || !img.classList.contains('img-free')) return;
    e.preventDefault();
    selectInlineImg(img);
    const body = bodyRef.current;
    const bw = body?.clientWidth || 1;
    const bh = body?.offsetHeight || 1;
    const startLeft = parseFloat(img.style.left) || 0;
    const startTop = parseFloat(img.style.top) || 0;
    const startX = e.clientX, startY = e.clientY;
    let moved = false;
    const onMove = (ev) => {
      moved = true;
      img.style.left = Math.max(0, startLeft + (ev.clientX - startX) / bw * 100) + '%';
      img.style.top = Math.max(0, startTop + (ev.clientY - startY) / bh * 100) + '%';
      setSelImg(s => (s && s.imgId === img.dataset.inline) ? { ...s, rect: img.getBoundingClientRect() } : s);
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if (moved) updateNoteFields({ body: bodyRef.current.innerHTML });
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  };
  const startImgResize = (e) => {
    e.preventDefault(); e.stopPropagation();

    if (!img) return;
    const bw = bodyRef.current?.clientWidth || 1;
    const startX = e.clientX, startW = img.getBoundingClientRect().width;
    const onMove = (e) => { img.style.width = Math.max(60, startW + e.clientX - startX) / bw * 100 + '%'; };

      updateNoteFields({ body: bodyRef.current.innerHTML });
      setSelImg(s => s ? { ...s, rect: img.getBoundingClientRect() } : s);
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.body.style.cursor = '';
    };
    document.body.style.cursor = 'se-resize';
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  };
  const delImage = async (imgId) => {
    const img = noteImages.find(im => im.id === imgId);
    await deleteDoc(imgDoc(imgId));

    // 這是舊有的既定行為（沒辦法自動把標註轉到新方向），先跳出警告避免使用者沒注意到就

      if (task.images[imgIndex]?.strokes?.length && !window.confirm('這張照片已經有標註，旋轉會清除目前的標註（無法保留），確定要繼續嗎？')) return;

    const recur = typeof input === 'object' ? (input.recur || null) : null;
    const recurInterval = typeof input === 'object' ? (input.recurInterval || null) : null;
    const noteIds = typeof input === 'object' && Array.isArray(input.noteIds) ? input.noteIds : [];
    if (!projectId) return;
    try {
      const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("連線逾時")), 5000));
      const addPromise = addDoc(collection(db, `users/${user.uid}/tasks`), {

    } catch (err) {

  const updateTaskDueDate = async (id, dueDate, reminderOffset, recur, recurInterval) => {

  const completeTask = async (reason, relayPayload) => {

    await updateDoc(doc(db, `users/${user.uid}/tasks/${completeTaskId}`), {
      done: true, doneReason: reason, doneAt: serverTimestamp()
    });
    if (task && task.recur && task.dueDate) {
      const nextDate = nextOccurrenceDate(task.dueDate, task.recur, task.recurInterval);
      await addDoc(collection(db, `users/${user.uid}/tasks`), {

        pinned: false, sortOrder: Date.now(), created: serverTimestamp(),

          ]);

            ...(data.projects||[]).filter(p => !existP.has(p.id)).map(p => ({ col: 'projects', ...p })),

          for (let i = 0; i < items.length; i += 400) {

            await batch.commit();
          }
          for (const n of newNotes) {
            if (!n._images?.length) continue;
            for (let i = 0; i < n._images.length; i += 400) {
              const batch = writeBatch(db);

              await batch.commit();
            }
          }
          notify(`還原完成！共新增 ${items.length} 筆資料。`, 'success', 4500);
        } catch (err) { notify('還原失敗：' + err.message, 'error', 4500); }
        finally { setBackupLoading(false); }

  const migrateToStorage = () => {
    askConfirm({
      title: '搬移照片到 Firebase Storage',
      message:
        '這會掃描所有筆記，將尚未搬移的照片上傳到 Firebase Storage。\n\n' +
        '過程中請勿關閉分頁；中途中斷可再次執行接續。照片庫舊資料暫不會刪除。確定開始？',
      confirmText: '開始搬移',
      onConfirm: async () => {
        setMigrateLoading(true);
        let inlineDone = 0, galleryDone = 0, failCount = 0;
        try {
          const noteSnap = await getDocs(collection(db, `users/${user.uid}/notes`));
          const notes = noteSnap.docs;
          let noteCount = 0;
          for (const nDoc of notes) {
            noteCount++;
            setMigrateProgress(`處理筆記 ${noteCount}/${notes.length}…`);
            const noteId = nDoc.id;
            const noteData = nDoc.data();

            if (noteData.body && noteData.body.includes('data:image')) {
              const tempDiv = document.createElement('div');
              tempDiv.innerHTML = noteData.body;
              const imgs = Array.from(tempDiv.querySelectorAll('img[src^="data:"], img[data-original^="data:"]'));
              let changed = false;
              for (const img of imgs) {
                if (img.getAttribute('data-original')?.startsWith('data:')) {
                  try {
                    const blob = await dataUrlToBlob(img.getAttribute('data-original'));
                    const path = `users/${user.uid}/notes/${noteId}/inline/${uid()}.jpg`;
                    const url = await uploadImageBlob(path, blob);
                    img.setAttribute('data-original', url);
                    changed = true;
                    inlineDone++;
                  } catch (err) { failCount++; }
                }
                if (!img.getAttribute('src')?.startsWith('data:')) continue;
                try {
                  const blob = await dataUrlToBlob(img.getAttribute('src'));
                  const path = `users/${user.uid}/notes/${noteId}/inline/${uid()}.jpg`;
                  const url = await uploadImageBlob(path, blob);
                  img.setAttribute('src', url);
                  img.dataset.path = path;
                  changed = true;
                  inlineDone++;
                } catch (err) { failCount++; }
              }
              if (changed) await updateDoc(doc(db, `users/${user.uid}/notes/${noteId}`), { body: tempDiv.innerHTML });
            }

            const imgSnap = await getDocs(collection(db, `users/${user.uid}/notes/${noteId}/images`));
            for (const imDoc of imgSnap.docs) {
              const im = imDoc.data();
              if (im.url || !im.dataUrl) continue;
              try {
                const blob = await dataUrlToBlob(im.dataUrl);
                const path = `users/${user.uid}/notes/${noteId}/images/${imDoc.id}.jpg`;
                const url = await uploadImageBlob(path, blob);
                await updateDoc(imDoc.ref, { url, path });
                galleryDone++;
              } catch (err) { failCount++; }
            }
          }
          notify(
            `搬移完成！內文 ${inlineDone} 張、照片庫 ${galleryDone} 張` + (failCount ? `（${failCount} 張失敗可重試）` : ''),
            failCount ? 'warning' : 'success', 5000
          );
        } catch (err) {
          notify('搬移過程發生錯誤：' + err.message, 'error', 5000);
        } finally {
          setMigrateLoading(false);
          setMigrateProgress('');
        }
      }
    });

  // 排序優先順序：釘選 > 拖曳自訂順序(sortOrder) > 預設排序
  const byOrder = (a, b) => {
    const pin = (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
    if (pin !== 0) return pin;
    if (a.sortOrder != null && b.sortOrder != null) return a.sortOrder - b.sortOrder;
    if (a.sortOrder != null) return -1;
    if (b.sortOrder != null) return 1;
    return 0;
  };
  const overdueProjectIds = new Set(

  );

  const activeProjects = projects.filter(p => !p.deleted).sort((a, b) =>
    byOrder(a, b) || getSafeTime(b.created) - getSafeTime(a.created));
  const sortedProjectFolders = [...projectFolders].sort((a, b) =>
    byOrder(a, b) || getSafeTime(a.created) - getSafeTime(b.created));
  const flatProjectFolders = (() => {
    const byParent = {};
    sortedProjectFolders.forEach(f => { const pid = f.parentId || null; (byParent[pid] = byParent[pid] || []).push(f); });
    const out = [];
    const walk = (pid, depth) => { (byParent[pid] || []).forEach(f => { out.push({ f, depth }); walk(f.id, depth + 1); }); };
    walk(null, 0);
    return out;
  })();
  const sortedNoteFolders = [...noteFolders].sort((a, b) =>
    byOrder(a, b) || getSafeTime(a.created) - getSafeTime(b.created));

  });
  const sortedTasks = [...visibleTasks].sort((a, b) => {

                      };
                      tmp.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                    return;
                  }
                  // 自己從筆記裡複製/剪下的內容，onCopy/onCut 會在 HTML 外面包一層帶標記的
                  // <div data-43note-copy>，貼上時認得出來就直接保留格式貼回去（字型、顏色、
                  // 螢光筆都在）。認不出標記（代表是從網頁、Word、其他 App 複製來的）才去除
                  // 格式貼成純文字——避免帶入來源的表格/清單/大量 inline style，把筆記結構弄亂
                  // （例如法規網站的巢狀表格）。真的要保留格式的圖片已經在上面用
                  // clipboardData.items 的 image/* 分支處理掉了，這裡只剩文字/HTML。
                  const pastedHtml = e.clipboardData?.getData('text/html') || '';
                  if (pastedHtml.includes('data-43note-copy')) {
                    e.preventDefault();
                    const tmp = document.createElement('div');
                    tmp.innerHTML = pastedHtml;
                    const wrap = tmp.querySelector('[data-43note-copy]');
                    document.execCommand('insertHTML', false, wrap ? wrap.innerHTML : pastedHtml);
                    updateNoteFields({ body: bodyRef.current?.innerHTML || '' });
                    return;
                  }
                  e.preventDefault();
                  const pt = e.clipboardData?.getData('text/plain') || '';
                  if (pt) document.execCommand('insertText', false, pt);
                },
                onCopy: (e) => {
                  // 標記起來，等一下貼回「這篇/別篇筆記」時才認得出是自己複製的，可以保留格式
                  const sel = window.getSelection();
                  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return; // 沒選東西，讓瀏覽器照平常處理
                  const frag = sel.getRangeAt(0).cloneContents();
                  const wrap = document.createElement('div');
                  wrap.setAttribute('data-43note-copy', '1');
                  wrap.appendChild(frag);
                  e.clipboardData.setData('text/html', wrap.outerHTML);
                  e.clipboardData.setData('text/plain', sel.toString());
                  e.preventDefault();
                },
                onCut: (e) => {
                  const sel = window.getSelection();
                  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
                  const range = sel.getRangeAt(0);
                  const frag = range.cloneContents();
                  const wrap = document.createElement('div');
                  wrap.setAttribute('data-43note-copy', '1');
                  wrap.appendChild(frag);
                  e.clipboardData.setData('text/html', wrap.outerHTML);
                  e.clipboardData.setData('text/plain', sel.toString());
                  e.preventDefault();
                  const now = Date.now();
                  if (now - bodyUndoLastPush.current > 800) {
                    bodyUndoStack.current = [...bodyUndoStack.current, activeNote.body || ''].slice(-50);
                    bodyUndoLastPush.current = now;
                    setCanBodyUndo(true);
                  }
                  range.deleteContents();
                  updateNoteFields({ body: bodyRef.current?.innerHTML || '' });
                },
                onKeyDown: (e) => {
                  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undoBodyEdit(); return; }
                  if (e.key === 'Backspace' || e.key === 'Delete') {
                    const body = bodyRef.current;
                    if (body && selBreakRef.current && body.contains(selBreakRef.current)) {
                      e.preventDefault();
                      selBreakRef.current.remove();
                      selBreakRef.current = null;
                      updateNoteFields({ body: body.innerHTML });
                      return;
                    }
                    const sel0 = window.getSelection();
                    if (body && sel0.rangeCount) {
                      const range = sel0.getRangeAt(0);
                      const isPageBreak = (n) => n && n.nodeType === 1 && (n.classList?.contains('page-break') || n.classList?.contains('print-stop'));
                      let target = null;
                      if (!range.collapsed) {
                        if (range.startContainer === range.endContainer && range.startContainer.nodeType === 1 &&
                            range.endOffset - range.startOffset === 1) {
                          target = range.startContainer.childNodes[range.startOffset];
                        }
                      } else {
                        const { startContainer: c, startOffset: o } = range;
                        if (e.key === 'Backspace') {
                          if (c.nodeType === 1 && o > 0) target = c.childNodes[o - 1];
                          else if (c.nodeType === 1 && o === 0) target = c.previousSibling || (c.parentNode !== body ? c.parentNode.previousSibling : null);
                          else if (c.nodeType === 3 && o === 0) target = c.previousSibling || (c.parentNode !== body ? c.parentNode.previousSibling : null);
                        } else {
                          if (c.nodeType === 1) target = c.childNodes[o] || c.nextSibling;
                          else if (c.nodeType === 3 && o === c.textContent.length) target = c.nextSibling || (c.parentNode !== body ? c.parentNode.nextSibling : null);
                        }
                      }
                      if (isPageBreak(target)) {
                        e.preventDefault();
                        target.remove();
                        updateNoteFields({ body: body.innerHTML });
                        return;
                      }
                    }
                  }
                  if (e.key !== 'Tab' && e.key !== 'Enter') return;
                  const sel = window.getSelection();
                  let listNode = null;
                  if (sel.rangeCount && bodyRef.current) {
                    let n = sel.getRangeAt(0).startContainer;
                    while (n && n.parentNode !== bodyRef.current) n = n.parentNode;
                    if (n && n.nodeType === 1 && ['li1','li2','li3'].some(c => n.className?.split(' ').includes(c))) listNode = n;
                  }
                  if (e.key === 'Tab') {
                    e.preventDefault();
                    if (listNode) {
                      const levels = ['li1','li2','li3'];
                      const idx = levels.findIndex(c => listNode.className?.split(' ').includes(c));
                      if (!e.shiftKey && idx < 2) listNode.className = levels[idx + 1];
                      else if (e.shiftKey && idx > 0) listNode.className = levels[idx - 1];
                      const r = document.createRange(); r.selectNodeContents(listNode); r.collapse(false);
                      sel.removeAllRanges(); sel.addRange(r);
                      updateNoteFields({ body: bodyRef.current.innerHTML });
                    } else if (!e.shiftKey) { document.execCommand('insertHTML', false, '    '); }
                    return;
                  }
                  if (e.key === 'Enter' && !e.shiftKey && listNode) {
                    e.preventDefault();
                    const cls = ['li1','li2','li3'].find(c => listNode.className?.split(' ').includes(c));
                    const text = listNode.textContent.trim();
                    if ({ li1: /^\d+\.\s*$/, li2: /^[a-z]\.\s*$/, li3: /^[。]\s*$/ }[cls].test(text)) {
                      listNode.className = ''; listNode.innerHTML = '<br>';
                      const r = document.createRange(); r.setStart(listNode, 0); r.collapse(true);
                      sel.removeAllRanges(); sel.addRange(r);
                    } else {
                      let px;
                      if (cls === 'li1') { const m = text.match(/^(\d+)\./); px = m ? (parseInt(m[1])+1)+'.' : '1.'; }
                      else if (cls === 'li2') { const m = text.match(/^([a-z])\./); px = (m && m[1] < 'z') ? String.fromCharCode(m[1].charCodeAt(0)+1)+'.' : 'a.'; }
                      else px = '。';
                      const el = document.createElement('div'); el.className = cls; el.textContent = px + ' ';
                      listNode.after(el);
                      const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
                      sel.removeAllRanges(); sel.addRange(r);
                    }
                    updateNoteFields({ body: bodyRef.current.innerHTML }); return;
                  }
                },
                style: { ...S.bodyArea, borderRadius: readMode ? 12 : '0 0 12px 12px', borderTop: readMode ? '1px solid var(--border)' : 'none',
                  minHeight: bodyExpanded ? 'calc(100dvh - 210px)' : 320, overflow: 'auto', resize: 'none' }
              }),
            (noteImages.length > 0) && h('div', { style: S.imgGrid },
              ...noteImages.map((im, i) =>
                h(ImageCard, { key: im.id, image: im, index: i,
                  onView: () => setLightbox({ list: noteImages, index: i, onAnnotateIndex: (idx) => { setLightbox(null); setAnnotating({ type: 'note', imgIndex: idx }); } }),
                  onAnnotate: () => setAnnotating({ type: 'note', imgIndex: i }),
                  onCrop: () => setCropping({ type: 'note', imgIndex: i, src: im.url || im.dataUrl }),
                  onDelete: () => setConfirmDel({ type: "image", id: im.id }),
                  confirmingDelete: confirmDel?.type === "image" && confirmDel.id === im.id,
                  onConfirmDelete: () => delImage(im.id),
                  onRotateLeft: () => rotateImage(im.id, 270),
                  onRotateRight: () => rotateImage(im.id, 90),
                })))
          )
    ),

    selImg && (() => {
      const r = selImg.rect;
      const estW = Math.min(540, window.innerWidth - 16);
      const clampedLeft = Math.max(8, Math.min(r.left, window.innerWidth - estW - 8));
      const clampedTop = r.top > 56 ? r.top - 44 : Math.min(window.innerHeight - 56, r.bottom + 8);
      const btnStyle = { display: 'inline-flex', alignItems: 'center', gap: 3, color: '#e2e8f0', background: 'none', border: 'none', cursor: 'pointer', fontSize: 12, padding: '4px 7px', borderRadius: 6 };
      const setW = (w) => {
        const img = bodyRef.current?.querySelector(`img[data-inline="${selImg.imgId}"]`);
        if (img) { img.style.width = w; updateNoteFields({ body: bodyRef.current.innerHTML }); setSelImg(s => s ? { ...s, rect: img.getBoundingClientRect() } : s); }
      };
      const toggleRow = (e) => {
        e.preventDefault();
        e.stopPropagation();
        const img = bodyRef.current?.querySelector(`img[data-inline="${selImg.imgId}"]`);
        if (!img) return;
        const currently = img.classList.contains('img-row');
        if (currently) {
          img.classList.remove('img-row');
          img.style.float = '';
          img.style.width = '';
          img.style.margin = '';
        } else {
          img.classList.add('img-row');
          img.style.width = img.style.width || '48%';
        }
        updateNoteFields({ body: bodyRef.current.innerHTML });
        setSelImg(s => s ? { ...s, rect: img.getBoundingClientRect() } : s);
      };
      const isRow = !!bodyRef.current?.querySelector(`img[data-inline="${selImg.imgId}"]`)?.classList.contains('img-row');
      const toggleFree = (e) => {
        e.preventDefault();
        e.stopPropagation();
        const img = bodyRef.current?.querySelector(`img[data-inline="${selImg.imgId}"]`);
        const body = bodyRef.current;
        if (!img || !body) return;
        if (img.classList.contains('img-free')) {
          img.classList.remove('img-free');
          img.style.position = ''; img.style.left = ''; img.style.top = '';
          img.draggable = true;
        } else {
          img.classList.remove('img-row');
          img.style.float = '';
          const bRect = body.getBoundingClientRect();
          const iRect = img.getBoundingClientRect();
          const bw = body.clientWidth || 1, bh = body.offsetHeight || 1;
          img.style.left = ((iRect.left - bRect.left + body.scrollLeft) / bw * 100) + '%';
          img.style.top = ((iRect.top - bRect.top + body.scrollTop) / bh * 100) + '%';
          img.classList.add('img-free');
          img.draggable = false;
        }
        updateNoteFields({ body: body.innerHTML });
        setSelImg(s => s ? { ...s, rect: img.getBoundingClientRect() } : s);
      };
      const isFree = !!bodyRef.current?.querySelector(`img[data-inline="${selImg.imgId}"]`)?.classList.contains('img-free');
      const isBorder = !!bodyRef.current?.querySelector(`img[data-inline="${selImg.imgId}"]`)?.classList.contains('img-border');
      const toggleBorder = () => {
        const img = bodyRef.current?.querySelector(`img[data-inline="${selImg.imgId}"]`);
        if (!img) return;
        img.classList.toggle('img-border');
        updateNoteFields({ body: bodyRef.current.innerHTML });
        setSelImg(s => s ? { ...s, rect: img.getBoundingClientRect() } : s);
      };
      const sep = h('div', { style: { width: 1, height: 16, background: '#334155', margin: '0 2px', flexShrink: 0 } });
      return h(React.Fragment, null,
        h('div', { className: 'no-print img-float-bar', onPointerDown: e => { if (e.pointerType === 'mouse') e.preventDefault(); },
          style: { position: 'fixed', top: clampedTop, left: clampedLeft, zIndex: 400,
            background: '#0f172a', border: '1px solid #334155', borderRadius: 10, padding: '4px 6px', display: 'flex', alignItems: 'center', gap: 2,
            boxShadow: '0 10px 28px rgba(0,0,0,0.45)', whiteSpace: 'nowrap', maxWidth: 'calc(100vw - 16px)' } },
          h('button', { style: btnStyle, onClick: () => setW('25%'), title: '寬度 25%' }, '小'),
          h('button', { style: btnStyle, onClick: () => setW('50%'), title: '寬度 50%' }, '中'),
          h('button', { style: btnStyle, onClick: () => setW('100%'), title: '寬度 100%' }, '大'),
          sep,
          h('button', {
            style: { ...btnStyle, color: isRow ? '#fbbf24' : '#94a3b8', background: isRow ? 'rgba(251,191,36,.18)' : 'none' },
            onClick: toggleRow, title: isRow ? '切換為獨排' : '切換為並排'
          }, isRow ? '獨排' : '並排'),
          h('button', {
            style: { ...btnStyle, color: isFree ? '#fbbf24' : '#94a3b8', background: isFree ? 'rgba(251,191,36,.18)' : 'none' },
            onClick: toggleFree, title: isFree ? '取消自由擺放' : '自由擺放（拖曳定位）'
          }, isFree ? '自由' : '定位'),
          h('button', {
            style: { ...btnStyle, color: isBorder ? '#fbbf24' : '#94a3b8', background: isBorder ? 'rgba(251,191,36,.18)' : 'none' },
            onClick: toggleBorder, title: isBorder ? '移除框線' : '加上框線'
          }, '框線'),
          sep,
          h('button', { style: btnStyle, title: '裁切', onClick: () => {
            const img = bodyRef.current?.querySelector(`img[data-inline="${selImg.imgId}"]`);
            if (img) setCropping({ type: 'inline', imgId: selImg.imgId, src: img.src });
          } }, h(Icon, { name: 'crop', size: 13 })),
          h('button', { style: btnStyle, title: '向左旋轉', onClick: () => rotateInlineImg(selImg.imgId, 270) }, h(Icon, { name: 'rotateCcw', size: 13 })),
          h('button', { style: btnStyle, title: '向右旋轉', onClick: () => rotateInlineImg(selImg.imgId, 90) }, h(Icon, { name: 'rotateCw', size: 13 })),
          sep,
          h('button', { style: { ...btnStyle, color: '#2dd4bf', fontWeight: 600 },
            onClick: () => {
              const img = bodyRef.current?.querySelector(`img[data-inline="${selImg.imgId}"]`);
              let strokes = [];
              try { strokes = JSON.parse(img?.dataset.strokes || '[]'); } catch {}
              setAnnotating({ type: 'inline', imgId: selImg.imgId, src: img?.dataset.original || selImg.src, strokes });
              clearSelImg();
            } }, h(Icon, { name: 'brush', size: 13 }), '標註'),
          sep,
          h('button', { style: btnStyle, title: '剪下（可貼到別篇筆記）', onClick: () => { cutInlineImg(selImg.imgId); notify('已剪下圖片，可到任意筆記貼上', 'info'); } }, h(Icon, { name: 'scissors', size: 13 })),
          h('button', { style: btnStyle, title: '複製（可貼到別篇筆記）', onClick: () => { copyInlineImg(selImg.imgId); notify('已複製圖片，可到任意筆記貼上', 'info'); } }, h(Icon, { name: 'copy', size: 13 })),
          h('button', { style: { ...btnStyle, color: '#f87171' }, title: '刪除圖片',
            onClick: () => { deleteInlineImg(selImg.imgId); clearSelImg(); } }, h(Icon, { name: 'trash', size: 13 })),
        ),
        h('div', { className: 'no-print', onMouseDown: startImgResize,
          style: { position: 'fixed', left: r.right - 8, top: r.bottom - 8, width: 14, height: 14,
            background: 'var(--accent)', border: '2px solid #fff', borderRadius: 3, cursor: 'se-resize', zIndex: 401, boxShadow: '0 2px 6px rgba(0,0,0,0.35)' } })
      );
    })(),
    annotating && (() => {
      if (annotating.type === 'inline') return h(PhotoAnnotator, {
        src: annotating.src, initialStrokes: annotating.strokes || [], initialGrayscale: false,
        onSave: saveAnnotation, onClose: () => setAnnotating(null)
      });
      const im = annotating.type === 'task'
        ? tasks.find(t => t.id === annotating.id)?.images[annotating.imgIndex]
        : noteImages[annotating.imgIndex];
      return im ? h(PhotoAnnotator, {
        src: im.url || im.dataUrl, initialStrokes: im.strokes || [], initialGrayscale: !!im.grayscale,
        onSave: saveAnnotation, onClose: () => setAnnotating(null)
      }) : null;
    })(),
    cropping && h(PhotoCropper, { src: cropping.src, onSave: saveCrop, onClose: () => setCropping(null) }),
    lightbox && h(Lightbox, { image: lightbox, onClose: () => setLightbox(null) }),
    newTaskModal && h(NewTaskModal, { onConfirm: addTask, onCancel: () => setNewTaskModal(false), notes: visibleNotes, initialDueDate: newTaskModal.dueDate || '', initialNoteIds: newTaskModal.noteIds || [] }),
    linkNotesTask && h(NoteLinkModal, {
      notes: linkNotesTaskNotes, projects,
      selectedIds: linkNotesTask.noteIds || [],
      onSave: (ids) => updateTaskNoteLinks(linkNotesTask.id, ids),
      onCancel: () => setLinkNotesTask(null)
    }),
    caseTagNote && h(NoteCaseTagModal, {
      note: caseTagNote, projects,
      onSave: (tags) => updateNoteCaseTags(caseTagNote.id, tags),
      onCancel: () => setCaseTagNote(null)
    }),
    setDueDateTask && h(DueDateModal, {
      task: setDueDateTask,
      onSave: (dueDate, reminderOffset, recur, recurInterval) => updateTaskDueDate(setDueDateTask.id, dueDate, reminderOffset, recur, recurInterval),
      onCancel: () => setSetDueDateTask(null)
    }),
    completeTaskId && h(CompleteTaskModal, {
      task: completingTask, notes: completingTaskNotes,
      zIndex: 700,
      onConfirm: completeTask, onCancel: () => setCompleteTaskId(null)
    }),
    folderMenu && h('div', { className: 'modal-overlay', style: S.modalOverlay, onClick: () => setFolderMenu(null) },
      h('div', { className: 'modal-card', style: { ...S.modalCard, maxWidth: 280 }, onClick: e => e.stopPropagation() },
        h('h3', { style: { ...S.modalTitle, fontSize: 15, marginBottom: 12 } }, h(Icon, { name: 'folder', size: 16, color: 'var(--accent)' }), '移到資料夾'),
        h('div', { className: 'list-row', onClick: () => folderMenu.type === 'project' ? setProjectFolder(folderMenu.id, null) : setNoteFolder(folderMenu.id, null),
          style: { padding: '9px 12px', cursor: 'pointer', borderRadius: 8, border: '1px solid var(--border)', marginBottom: 6, fontSize: 13.5, display: 'flex', alignItems: 'center', gap: 8 } }, h(Icon, { name: 'folder', size: 14, color: 'var(--text-faint)' }), '未分類'),
        ...(folderMenu.type === 'project'
          ? flatProjectFolders.map(({ f, depth }) =>
              h('div', { key: f.id, className: 'list-row', onClick: () => setProjectFolder(folderMenu.id, f.id),
                style: { padding: '9px 12px', cursor: 'pointer', borderRadius: 8, border: '1px solid var(--border)', marginBottom: 6, fontSize: 13.5, marginLeft: depth * 12, display: 'flex', alignItems: 'center', gap: 8 } }, h(Icon, { name: 'folder', size: 14, color: 'var(--accent)' }), f.name)
            )
          : noteFolders.map(f =>
              h('div', { key: f.id, className: 'list-row', onClick: () => setNoteFolder(folderMenu.id, f.id),
                style: { padding: '9px 12px', cursor: 'pointer', borderRadius: 8, border: '1px solid var(--border)', marginBottom: 6, fontSize: 13.5, display: 'flex', alignItems: 'center', gap: 8 } }, h(Icon, { name: 'folder', size: 14, color: 'var(--accent)' }), f.name)
            )
        ),
        h('button', { className: 'btn-ghost', onClick: () => setFolderMenu(null), style: { ...S.ghostBtn, width: '100%', marginTop: 6 } }, '取消')
      )
    ),
    noteTagPicker && h('div', { className: 'modal-overlay', style: S.modalOverlay, onClick: () => setNoteTagPicker(false) },
      h('div', { className: 'modal-card', style: { ...S.modalCard, maxWidth: 380, maxHeight: '75vh', display: 'flex', flexDirection: 'column' }, onClick: e => e.stopPropagation() },
        h('h3', { style: S.modalTitle }, h(Icon, { name: 'link', size: 16, color: 'var(--accent)' }), '標記筆記'),
        h('input', { autoFocus: true, value: noteTagQuery, onChange: e => setNoteTagQuery(e.target.value),
          placeholder: '搜尋筆記標題…', style: { ...S.modalInput, marginBottom: 10 } }),
        h('div', { style: { overflowY: 'auto', flex: 1 } },
          allNotesForSearch.length === 0
            ? h('div', { style: S.empty }, '載入中…')
            : (() => {
                const q = noteTagQuery.trim();
                const list = allNotesForSearch
                  .filter(n => n.id !== activeNote?.id)
                  .filter(n => !q || ciIncludes(n.title, q))
                  .sort((a, b) => getSafeTime(b.updated || b.created) - getSafeTime(a.updated || a.created))
                  .slice(0, 80);
                return list.length === 0
                  ? h('div', { style: S.empty }, '找不到符合的筆記')
                  : list.map(n => h('div', {
                      key: n.id, className: 'list-row', onClick: () => confirmInsertNoteTag(n),
                      style: { padding: '9px 12px', cursor: 'pointer', borderRadius: 8, border: '1px solid var(--border)', marginBottom: 6 }
                    },
                      h('div', { style: { fontSize: 13.5, fontWeight: 500, color: 'var(--text-primary)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, n.title || '未命名筆記'),
                      h('div', { style: { fontSize: 11, color: 'var(--text-faint)', marginTop: 2 } }, projects.find(p => p.id === n.projectId)?.name || '')
                    ));
              })()
        ),
        h('button', { className: 'btn-ghost', onClick: () => setNoteTagPicker(false), style: { ...S.ghostBtn, width: '100%', marginTop: 8 } }, '取消')
      )
    ),
    globalSearchModal
  );
}

createRoot(document.getElementById('root')).render(h(App));

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
